name: SIDEPLAY 0.8.1 — MANUAL SHA-LOCKED BUILD

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: BUILD EXACT v0.8.1 ONLY
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prove this is the SHA-locked workflow
        shell: bash
        run: |
          set -euo pipefail
          echo "WORKFLOW=$GITHUB_WORKFLOW"
          echo "RUN=$GITHUB_RUN_NUMBER"
          echo "COMMIT=$GITHUB_SHA"
          test "$GITHUB_WORKFLOW" = "SIDEPLAY 0.8.1 — MANUAL SHA-LOCKED BUILD"

      - name: Require the exact v0.8.1 source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="SidePlay-Node-v0.8.1-STAY-INSIDE-BACKGROUND.zip"
          EXPECTED="9d7f0b8f14a5f26f543862fda18d0296395174f7e9c4c1b3bfbac4c139c11242"

          test -f "$ZIP" || { echo "ERROR: exact ZIP missing: $ZIP"; exit 1; }
          ACTUAL="$(sha256sum "$ZIP" | awk '{print $1}')"
          echo "ZIP SHA256=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED" || {
            echo "ERROR: wrong SidePlay ZIP. Expected $EXPECTED"
            exit 1
          }

          rm -rf sideplay release signing
          mkdir -p sideplay
          unzip -q "$ZIP" -d sideplay

          VERSION="$(node -p "require('./sideplay/package.json').version")"
          echo "SOURCE VERSION=$VERSION"
          test "$VERSION" = "0.8.1"

          grep -q 'SidePlay/0.8.1 Android' sideplay/native/android/PlaybackService.java
          rm -rf sideplay/android
          echo "✅ Exact v0.8.1 source verified by filename + SHA + package version + native marker"

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install and build web app
        working-directory: sideplay
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build

      - name: Generate a fresh Android project
        working-directory: sideplay
        shell: bash
        run: |
          set -euo pipefail
          test ! -d android
          npx cap add android
          npx cap sync android
          node scripts/patch-android.mjs

          test -f android/app/src/main/java/app/sideplay/mobile/PlaybackService.java
          grep -q 'SidePlay/0.8.1 Android' android/app/src/main/java/app/sideplay/mobile/PlaybackService.java

      - name: Force Android version metadata to 0.8.1 / 801
        working-directory: sideplay
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/build.gradle')
          s = p.read_text()
          s, n1 = re.subn(r'(?m)^(\s*)versionCode\s+\d+\s*$', r'\1versionCode 801', s, count=1)
          s, n2 = re.subn(r'(?m)^(\s*)versionName\s+["\'][^"\']+["\']\s*$', r'\1versionName "0.8.1"', s, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f'Could not set version metadata: code={n1}, name={n2}')
          p.write_text(s)
          PY
          grep -n 'versionCode 801' android/app/build.gradle
          grep -n 'versionName "0.8.1"' android/app/build.gradle

      - name: Build release APK
        working-directory: sideplay/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:clean :app:assembleRelease --stacktrace --no-daemon

      - name: Find unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find sideplay/android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*-release-unsigned.apk' | head -n1)"
          test -f "$APK"
          mkdir -p signing release
          cp "$APK" signing/sideplay-081-unsigned.apk

      - name: Prepare signing key
        shell: bash
        env:
          SIDEPLAY_KEYSTORE_B64: ${{ secrets.SIDEPLAY_KEYSTORE_B64 }}
          SIDEPLAY_KEYSTORE_PASSWORD: ${{ secrets.SIDEPLAY_KEYSTORE_PASSWORD }}
          SIDEPLAY_KEY_ALIAS: ${{ secrets.SIDEPLAY_KEY_ALIAS }}
          SIDEPLAY_KEY_PASSWORD: ${{ secrets.SIDEPLAY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${SIDEPLAY_KEYSTORE_B64:-}" ] && [ -n "${SIDEPLAY_KEYSTORE_PASSWORD:-}" ] && [ -n "${SIDEPLAY_KEY_ALIAS:-}" ] && [ -n "${SIDEPLAY_KEY_PASSWORD:-}" ]; then
            echo "$SIDEPLAY_KEYSTORE_B64" | base64 --decode > signing/sideplay.jks
            echo "KS_PASS=$SIDEPLAY_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$SIDEPLAY_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASS=$SIDEPLAY_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v -keystore signing/sideplay.jks -storepass sideplay123 -keypass sideplay123 -alias sideplay -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SidePlay CI, OU=Testing, O=SidePlay, C=DO"
            echo "KS_PASS=sideplay123" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=sideplay" >> "$GITHUB_ENV"
            echo "KEY_PASS=sideplay123" >> "$GITHUB_ENV"
          fi

      - name: Align and sign
        shell: bash
        run: |
          set -euo pipefail
          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          OUT="release/SIDEPLAY_0.8.1_SHA_LOCKED_RUN_${GITHUB_RUN_NUMBER}.apk"
          "$ZIPALIGN" -f -p 4 signing/sideplay-081-unsigned.apk signing/sideplay-081-aligned.apk
          "$APKSIGNER" sign --ks signing/sideplay.jks --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:$KS_PASS" --key-pass "pass:$KEY_PASS" --out "$OUT" signing/sideplay-081-aligned.apk
          echo "APK_PATH=$OUT" >> "$GITHUB_ENV"

      - name: HARD VERIFY final APK is really 0.8.1
        shell: bash
        run: |
          set -euo pipefail
          AAPT2="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign"

          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH"
          "$ZIPALIGN" -c -v 4 "$APK_PATH"
          "$AAPT2" dump badging "$APK_PATH" | tee release/APK_BADGING.txt

          grep -q "package: name='app.sideplay.mobile'" release/APK_BADGING.txt
          grep -q "versionCode='801'" release/APK_BADGING.txt
          grep -q "versionName='0.8.1'" release/APK_BADGING.txt

          sha256sum "$APK_PATH" | tee release/SHA256.txt
          printf 'SIDEPLAY 0.8.1\nRUN=%s\nCOMMIT=%s\n' "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" > release/PROOF_081.txt

          echo "✅ FINAL APK PROVEN: versionName=0.8.1 versionCode=801"

      - name: Upload ONLY the SHA-locked v0.8.1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ONLY_THIS_SIDEPLAY_0.8.1_SHA_LOCKED_RUN-${{ github.run_number }}
          path: |
            ${{ env.APK_PATH }}
            release/APK_BADGING.txt
            release/SHA256.txt
            release/PROOF_081.txt
          if-no-files-found: error
          retention-days: 14
          
