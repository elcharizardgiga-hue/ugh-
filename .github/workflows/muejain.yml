name: SidePlay R10.2 — Background Survival APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build SidePlay v0.9.2-r10.2
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ZIP_NAME: SidePlay-v0.9.2-R10.2-BACKGROUND-SURVIVAL.zip
      EXPECTED_VERSION: 0.9.2-r10.2
      NODE_VERSION: "24"
      JAVA_VERSION: "17"

    steps:
      # ------------------------------------------------------------
      # 1. CHECKOUT
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. VERIFY ZIP EXISTS
      # ------------------------------------------------------------
      - name: Verify SidePlay source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Looking for: $ZIP_NAME"

          if [ ! -f "$ZIP_NAME" ]; then
            echo "::error::Could not find $ZIP_NAME in repository root."
            echo ""
            echo "Files in repository root:"
            ls -lah
            exit 1
          fi

          echo "Found source ZIP:"
          ls -lh "$ZIP_NAME"

      # ------------------------------------------------------------
      # 3. EXTRACT SOURCE
      # ------------------------------------------------------------
      - name: Extract SidePlay
        shell: bash
        run: |
          set -euo pipefail

          rm -rf sideplay-build
          mkdir -p sideplay-build

          unzip -q "$ZIP_NAME" -d sideplay-build

          echo "ZIP extracted."

          # Handle ZIPs containing either:
          #   package.json
          # or:
          #   SomeFolder/package.json

          PACKAGE_JSON="$(find sideplay-build -name package.json \
            -not -path '*/node_modules/*' \
            -print -quit)"

          if [ -z "$PACKAGE_JSON" ]; then
            echo "::error::package.json not found after extraction."
            find sideplay-build -maxdepth 3 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PACKAGE_JSON")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Detected project: $PROJECT_DIR"

      # ------------------------------------------------------------
      # 4. NODE
      # ------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.PROJECT_DIR }}/package-lock.json

      # ------------------------------------------------------------
      # 5. JAVA
      # ------------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # ------------------------------------------------------------
      # 6. ANDROID SDK
      # ------------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ------------------------------------------------------------
      # 7. VERIFY VERSION
      # ------------------------------------------------------------
      - name: Verify SidePlay version
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          ACTUAL_VERSION="$(node -p "require('./package.json').version")"

          echo "Expected: $EXPECTED_VERSION"
          echo "Actual:   $ACTUAL_VERSION"

          if [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::Version mismatch."
            exit 1
          fi

          echo "Version verified."

      # ------------------------------------------------------------
      # 8. INSTALL DEPENDENCIES
      # ------------------------------------------------------------
      - name: Install dependencies
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # ------------------------------------------------------------
      # 9. BUILD WEB APP
      # ------------------------------------------------------------
      - name: Build SidePlay web bundle
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          npm run build

      # ------------------------------------------------------------
      # 10. CAPACITOR SYNC
      # ------------------------------------------------------------
      - name: Sync Capacitor Android
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          npx cap sync android

      # ------------------------------------------------------------
      # 11. VERIFY ANDROID PROJECT
      # ------------------------------------------------------------
      - name: Verify Android project
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          if [ ! -d android ]; then
            echo "::error::android/ directory missing."
            exit 1
          fi

          if [ ! -f android/gradlew ]; then
            echo "::error::android/gradlew missing."
            exit 1
          fi

          chmod +x android/gradlew

          echo "Android project OK."

      # ------------------------------------------------------------
      # 12. PLAYBACK SERVICE SANITY CHECK
      # ------------------------------------------------------------
      - name: Verify Background PlaybackService
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          PLAYBACK_SERVICE="$(find android \
            -type f \
            -name 'PlaybackService.java' \
            -print -quit)"

          if [ -z "$PLAYBACK_SERVICE" ]; then
            echo "::error::PlaybackService.java not found after Capacitor sync."
            exit 1
          fi

          echo "PlaybackService:"
          echo "$PLAYBACK_SERVICE"

          if ! grep -q "MediaSessionService" "$PLAYBACK_SERVICE"; then
            echo "::error::PlaybackService does not appear to use MediaSessionService."
            exit 1
          fi

          echo "Background PlaybackService detected."

      # ------------------------------------------------------------
      # 13. SHOW GRADLE / JAVA INFO
      # ------------------------------------------------------------
      - name: Android build diagnostics
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          set -euo pipefail

          echo "JAVA:"
          java -version

          echo ""
          echo "GRADLE:"
          ./gradlew --version

      # ------------------------------------------------------------
      # 14. BUILD DEBUG APK
      # ------------------------------------------------------------
      - name: Build APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          set -euo pipefail

          ./gradlew clean assembleDebug \
            --stacktrace \
            --no-daemon

      # ------------------------------------------------------------
      # 15. LOCATE APK
      # ------------------------------------------------------------
      - name: Locate APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          APK="$(find android/app/build/outputs/apk \
            -type f \
            -name '*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::APK was not produced."
            find android/app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          mkdir -p release

          cp "$APK" \
            "release/SidePlay-v0.9.2-r10.2-BACKGROUND-SURVIVAL.apk"

          echo "APK_PATH=$PROJECT_DIR/release/SidePlay-v0.9.2-r10.2-BACKGROUND-SURVIVAL.apk" \
            >> "$GITHUB_ENV"

          echo "APK created:"
          ls -lh release/*.apk

      # ------------------------------------------------------------
      # 16. UPLOAD APK
      # ------------------------------------------------------------
      - name: Upload SidePlay APK
        uses: actions/upload-artifact@v4
        with:
          name: SidePlay-v0.9.2-r10.2-BACKGROUND-SURVIVAL
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30
