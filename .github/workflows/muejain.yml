name: Build StickerForge Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "./settings.gradle" ]; then
            PROJECT_DIR="."
          elif [ -f "./StickerForgeAndroid/settings.gradle" ]; then
            PROJECT_DIR="./StickerForgeAndroid"
          else
            echo "Could not find settings.gradle"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project: $PROJECT_DIR"

      - name: Show project information
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          java -version
          gradle --version
          echo "----- Files -----"
          find . -maxdepth 3 -type f | sort

      - name: Clean
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle clean --stacktrace

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle assembleDebug --stacktrace

      - name: Verify APK
        id: apk
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -1)"

          if [ -z "$APK" ]; then
            echo "APK WAS NOT GENERATED"
            exit 1
          fi

          echo "Found APK:"
          ls -lh "$APK"

          mkdir -p ../../stickerforge-output
          cp "$APK" ../../stickerforge-output/StickerForge-debug.apk

      - name: Upload StickerForge APK
        uses: actions/upload-artifact@v4
        with:
          name: StickerForge-Android-Debug
          path: stickerforge-output/StickerForge-debug.apk
          if-no-files-found: error
          retention-days: 30
