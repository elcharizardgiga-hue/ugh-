name: Build StickerForge Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build StickerForge APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ------------------------------------------------------------
      # 1. CHECKOUT
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. JAVA 17
      # ------------------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ------------------------------------------------------------
      # 3. GRADLE
      # StickerForge source currently doesn't contain a wrapper,
      # so GitHub installs Gradle for us.
      # ------------------------------------------------------------
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # ------------------------------------------------------------
      # 4. SHOW REPOSITORY FILES
      # Useful if GitHub ever decides to act possessed.
      # ------------------------------------------------------------
      - name: Inspect repository
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "REPOSITORY CONTENTS"
          echo "======================================"

          find . -maxdepth 3 -type f | sort

      # ------------------------------------------------------------
      # 5. FIND + EXTRACT STICKERFORGE ZIP
      #
      # Accepts things like:
      # StickerForgeAndroid-source.zip
      # StickerForgeAndroid-source (1).zip
      # stickerforge-whatever.zip
      # ------------------------------------------------------------
      - name: Find and extract StickerForge
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "SEARCHING FOR STICKERFORGE ZIP"
          echo "======================================"

          ZIP="$(find . -maxdepth 3 -type f \
            \( \
              -iname 'StickerForgeAndroid*.zip' \
              -o -iname '*StickerForge*.zip' \
              -o -iname '*stickerforge*.zip' \
            \) \
            | head -1)"

          if [ -z "$ZIP" ]; then
            echo ""
            echo "ERROR: Could not find a StickerForge ZIP."
            echo ""
            echo "ZIP files found in repository:"
            find . -maxdepth 3 -type f -iname '*.zip' -print || true
            echo ""
            echo "Repository contents:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "FOUND ZIP:"
          echo "$ZIP"

          rm -rf "$GITHUB_WORKSPACE/extracted"
          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -q "$ZIP" -d "$GITHUB_WORKSPACE/extracted"

          echo ""
          echo "======================================"
          echo "EXTRACTED CONTENTS"
          echo "======================================"

          find "$GITHUB_WORKSPACE/extracted" \
            -maxdepth 5 \
            -type f \
            | sort

      # ------------------------------------------------------------
      # 6. FIND ACTUAL ANDROID PROJECT
      #
      # We don't assume what directory exists inside the ZIP.
      # Instead, find settings.gradle / settings.gradle.kts.
      # ------------------------------------------------------------
      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "LOCATING ANDROID PROJECT"
          echo "======================================"

          SETTINGS="$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            \( \
              -name 'settings.gradle' \
              -o -name 'settings.gradle.kts' \
            \) \
            | head -1)"

          if [ -z "$SETTINGS" ]; then
            echo ""
            echo "ERROR: settings.gradle was not found."
            echo ""
            echo "Extracted files:"
            find "$GITHUB_WORKSPACE/extracted" \
              -maxdepth 6 \
              -type f \
              | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "Settings file:"
          echo "$SETTINGS"

          echo ""
          echo "Android project directory:"
          echo "$PROJECT_DIR"

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # 7. VERIFY PROJECT
      # ------------------------------------------------------------
      - name: Verify Android project
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "JAVA"
          echo "======================================"
          java -version

          echo ""
          echo "======================================"
          echo "GRADLE"
          echo "======================================"
          gradle --version

          echo ""
          echo "======================================"
          echo "ANDROID PROJECT"
          echo "======================================"
          pwd
          find . -maxdepth 4 -type f | sort

          if [ ! -d "app" ]; then
            echo ""
            echo "ERROR: app/ module not found."
            exit 1
          fi

          if [ ! -f "app/build.gradle" ] && \
             [ ! -f "app/build.gradle.kts" ]; then
            echo ""
            echo "ERROR: app/build.gradle not found."
            exit 1
          fi

      # ------------------------------------------------------------
      # 8. CLEAN
      # ------------------------------------------------------------
      - name: Clean project
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          gradle clean --stacktrace

      # ------------------------------------------------------------
      # 9. COMPILE DEBUG APK
      # ------------------------------------------------------------
      - name: Build StickerForge
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "BUILDING STICKERFORGE"
          echo "======================================"

          gradle assembleDebug \
            --stacktrace \
            --warning-mode all

      # ------------------------------------------------------------
      # 10. FIND GENERATED APK
      # ------------------------------------------------------------
      - name: Find generated APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "SEARCHING FOR APK"
          echo "======================================"

          APK="$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            | head -1)"

          if [ -z "$APK" ]; then
            echo ""
            echo "ERROR: Build completed but no APK was found."
            echo ""
            echo "Build outputs:"
            find "$GITHUB_WORKSPACE/extracted" \
              -path '*/build/outputs/*' \
              -type f \
              -print || true
            exit 1
          fi

          echo "FOUND APK:"
          echo "$APK"

          ls -lh "$APK"

          mkdir -p "$GITHUB_WORKSPACE/stickerforge-output"

          cp "$APK" \
            "$GITHUB_WORKSPACE/stickerforge-output/StickerForge-debug.apk"

          echo ""
          echo "Final APK:"
          ls -lh \
            "$GITHUB_WORKSPACE/stickerforge-output/StickerForge-debug.apk"

      # ------------------------------------------------------------
      # 11. UPLOAD APK TO GITHUB ACTIONS
      # ------------------------------------------------------------
      - name: Upload StickerForge APK
        uses: actions/upload-artifact@v4
        with:
          name: StickerForge-Android-APK
          path: stickerforge-output/StickerForge-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ------------------------------------------------------------
      # 12. UPLOAD BUILD REPORT IF SOMETHING FAILED
      # ------------------------------------------------------------
      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: StickerForge-Build-Diagnostics
          path: |
            extracted/**/build/reports/**
            extracted/**/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
