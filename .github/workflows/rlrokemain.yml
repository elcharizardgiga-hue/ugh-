name: SidePlay R10.2 — Background Survival APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build SidePlay v0.9.2-r10.2
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ZIP_NAME: SidePlay-v0.9.2-R10.2-BACKGROUND-SURVIVAL.zip
      EXPECTED_VERSION: 0.9.2-r10.2

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # VERIFY SOURCE ZIP
      # ============================================================

      - name: Verify SidePlay source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " SidePlay R10.2 — Background Survival"
          echo "=========================================="
          echo ""
          echo "Looking for:"
          echo "$ZIP_NAME"
          echo ""

          if [ ! -f "$ZIP_NAME" ]; then
            echo "::error::Could not find $ZIP_NAME in repository root."
            echo ""
            echo "Repository contents:"
            ls -lah
            exit 1
          fi

          echo "Source ZIP found:"
          ls -lh "$ZIP_NAME"


      # ============================================================
      # EXTRACT SOURCE
      # ============================================================

      - name: Extract SidePlay
        shell: bash
        run: |
          set -euo pipefail

          rm -rf sideplay-build
          mkdir -p sideplay-build

          echo "Extracting $ZIP_NAME..."

          unzip -q "$ZIP_NAME" -d sideplay-build

          echo ""
          echo "Searching for SidePlay package.json..."

          PACKAGE_JSON="$(
            find sideplay-build \
              -name package.json \
              -not -path '*/node_modules/*' \
              -print -quit
          )"

          if [ -z "$PACKAGE_JSON" ]; then
            echo "::error::package.json not found after extraction."
            echo ""
            echo "Extracted files:"
            find sideplay-build -maxdepth 3 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PACKAGE_JSON")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Detected SidePlay project:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Project contents:"
          ls -lah "$PROJECT_DIR"


      # ============================================================
      # NODE 24
      #
      # NO npm caching here.
      # The project directory is discovered dynamically.
      # ============================================================

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"


      - name: Verify Node environment
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " NODE"
          echo "=========================================="

          node --version
          npm --version

          echo ""
          echo "PROJECT_DIR=$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/package.json" ]; then
            echo "::error::PROJECT_DIR is invalid."
            exit 1
          fi


      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Verify Java
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " JAVA"
          echo "=========================================="

          java -version


      # ============================================================
      # USE GITHUB RUNNER'S PREINSTALLED ANDROID SDK
      #
      # IMPORTANT:
      # No android-actions/setup-android.
      # No sdkmanager invocation.
      # ============================================================

      - name: Detect preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " ANDROID SDK"
          echo "=========================================="

          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"

          SDK=""

          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ]; then
            SDK="$ANDROID_HOME"
          elif [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK="$ANDROID_SDK_ROOT"
          elif [ -d "/usr/local/lib/android/sdk" ]; then
            SDK="/usr/local/lib/android/sdk"
          fi

          if [ -z "$SDK" ]; then
            echo "::error::No Android SDK installation found on GitHub runner."
            exit 1
          fi

          echo ""
          echo "Using Android SDK:"
          echo "$SDK"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo ""
          echo "Installed platforms:"

          if [ -d "$SDK/platforms" ]; then
            ls -1 "$SDK/platforms"
          else
            echo "::error::Android platforms directory missing."
            exit 1
          fi

          echo ""
          echo "Installed build-tools:"

          if [ -d "$SDK/build-tools" ]; then
            ls -1 "$SDK/build-tools"
          else
            echo "::error::Android build-tools directory missing."
            exit 1
          fi

          echo ""
          echo "Android SDK ready."


      # ============================================================
      # VERIFY SIDEPLAY VERSION
      # ============================================================

      - name: Verify SidePlay version
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          ACTUAL_VERSION="$(node -p "require('./package.json').version")"

          echo "Expected version: $EXPECTED_VERSION"
          echo "Actual version:   $ACTUAL_VERSION"

          if [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::SidePlay version mismatch."
            exit 1
          fi

          echo ""
          echo "SidePlay version verified."


      # ============================================================
      # INSTALL NPM DEPENDENCIES
      # ============================================================

      - name: Install npm dependencies
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " NPM INSTALL"
          echo "=========================================="

          if [ -f package-lock.json ]; then
            echo "package-lock.json detected."
            echo "Running npm ci..."
            npm ci
          else
            echo "No package-lock.json detected."
            echo "Running npm install..."
            npm install
          fi


      # ============================================================
      # BUILD WEB APPLICATION
      # ============================================================

      - name: Build SidePlay web bundle
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " WEB BUILD"
          echo "=========================================="

          npm run build

          echo ""
          echo "Web application built."


      # ============================================================
      # CAPACITOR SYNC
      # ============================================================

      - name: Sync Capacitor Android
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " CAPACITOR SYNC"
          echo "=========================================="

          npx cap sync android

          echo ""
          echo "Capacitor Android sync completed."


      # ============================================================
      # VERIFY ANDROID PROJECT
      # ============================================================

      - name: Verify Android project
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          if [ ! -d android ]; then
            echo "::error::android/ directory missing."
            exit 1
          fi

          if [ ! -f android/gradlew ]; then
            echo "::error::android/gradlew missing."
            exit 1
          fi

          chmod +x android/gradlew

          echo "Android project detected."
          echo ""

          ls -lh android/gradlew


      # ============================================================
      # VERIFY BACKGROUND PLAYBACK SERVICE
      # ============================================================

      - name: Verify Background PlaybackService
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " PLAYBACK SERVICE"
          echo "=========================================="

          PLAYBACK_SERVICE="$(
            find android \
              -type f \
              -name 'PlaybackService.java' \
              -print -quit
          )"

          if [ -z "$PLAYBACK_SERVICE" ]; then
            echo "::error::PlaybackService.java not found."
            exit 1
          fi

          echo "PlaybackService:"
          echo "$PLAYBACK_SERVICE"

          echo ""

          if ! grep -q "MediaSessionService" "$PLAYBACK_SERVICE"; then
            echo "::error::PlaybackService does not use MediaSessionService."
            exit 1
          fi

          echo "MediaSessionService detected."

          if grep -q "SidePlay/" "$PLAYBACK_SERVICE"; then
            echo "SidePlay playback marker detected."
          else
            echo "::warning::SidePlay user-agent marker not found."
          fi

          echo ""
          echo "PlaybackService sanity check passed."


      # ============================================================
      # VERIFY ANDROID MANIFEST
      # ============================================================

      - name: Verify Android playback manifest
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          echo "=========================================="
          echo " ANDROID MANIFEST"
          echo "=========================================="

          if [ ! -f "$MANIFEST" ]; then
            echo "::error::AndroidManifest.xml missing."
            exit 1
          fi

          echo "Checking PlaybackService registration..."

          if grep -q "PlaybackService" "$MANIFEST"; then
            echo "PlaybackService registered."
          else
            echo "::warning::PlaybackService not found in manifest."
          fi

          echo ""
          echo "Checking foreground service permission..."

          if grep -q "FOREGROUND_SERVICE" "$MANIFEST"; then
            echo "FOREGROUND_SERVICE permission detected."
          else
            echo "::warning::FOREGROUND_SERVICE permission not found."
          fi

          echo ""
          echo "Checking WAKE_LOCK..."

          if grep -q "WAKE_LOCK" "$MANIFEST"; then
            echo "WAKE_LOCK permission detected."
          else
            echo "::warning::WAKE_LOCK permission not found."
          fi


      # ============================================================
      # CREATE LOCAL.PROPERTIES
      #
      # This explicitly tells Gradle which Android SDK to use.
      # ============================================================

      - name: Configure Android SDK for Gradle
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          set -euo pipefail

          echo "sdk.dir=$ANDROID_HOME" > local.properties

          echo "Generated android/local.properties:"
          cat local.properties


      # ============================================================
      # GRADLE DIAGNOSTICS
      # ============================================================

      - name: Gradle diagnostics
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " JAVA"
          echo "=========================================="

          java -version

          echo ""
          echo "=========================================="
          echo " GRADLE"
          echo "=========================================="

          ./gradlew --version

          echo ""
          echo "=========================================="
          echo " ANDROID"
          echo "=========================================="

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "local.properties:"
          cat local.properties


      # ============================================================
      # BUILD APK
      # ============================================================

      - name: Build SidePlay debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " BUILDING SIDEPLAY APK"
          echo "=========================================="
          echo ""

          ./gradlew \
            clean \
            assembleDebug \
            --stacktrace \
            --no-daemon


      # ============================================================
      # LOCATE APK
      # ============================================================

      - name: Locate generated APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "Searching for APK..."

          APK="$(
            find android/app/build/outputs/apk \
              -type f \
              -name '*.apk' \
              -print -quit
          )"

          if [ -z "$APK" ]; then
            echo "::error::Gradle finished but no APK was found."

            echo ""
            echo "Available build outputs:"

            find android/app/build/outputs \
              -type f \
              2>/dev/null || true

            exit 1
          fi

          echo ""
          echo "APK found:"
          echo "$APK"

          mkdir -p release

          OUTPUT_APK="release/SidePlay-v0.9.2-r10.2-BACKGROUND-SURVIVAL.apk"

          cp "$APK" "$OUTPUT_APK"

          ABSOLUTE_APK="$PROJECT_DIR/$OUTPUT_APK"

          echo "APK_PATH=$ABSOLUTE_APK" >> "$GITHUB_ENV"

          echo ""
          echo "Final APK:"
          ls -lh "$OUTPUT_APK"


      # ============================================================
      # APK SUMMARY
      # ============================================================

      - name: APK build summary
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " SIDEPLAY BUILD COMPLETE"
          echo "=========================================="

          echo ""
          echo "Version:"
          echo "$EXPECTED_VERSION"

          echo ""
          echo "APK:"
          echo "$APK_PATH"

          echo ""
          echo "Size:"
          du -h "$APK_PATH"

          echo ""
          echo "SHA-256:"
          sha256sum "$APK_PATH"


      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload SidePlay APK
        uses: actions/upload-artifact@v4
        with:
          name: SidePlay-v0.9.2-r10.2-BACKGROUND-SURVIVAL
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30
