name: SidePlay R10.2 — Background Survival APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build SidePlay v0.9.2-r10.2
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ZIP_NAME: SidePlay-v0.9.2-R10.2-BACKGROUND-SURVIVAL.zip
      EXPECTED_VERSION: 0.9.2-r10.2
      JAVA_VERSION: "17"

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # VERIFY SOURCE ZIP
      # ============================================================

      - name: Verify SidePlay source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " SidePlay R10.2 — Background Survival"
          echo "=========================================="
          echo ""
          echo "Looking for:"
          echo "$ZIP_NAME"
          echo ""

          if [ ! -f "$ZIP_NAME" ]; then
            echo "::error::Could not find $ZIP_NAME in repository root."
            echo ""
            echo "Repository contents:"
            ls -lah
            exit 1
          fi

          echo "Source ZIP found:"
          ls -lh "$ZIP_NAME"

      # ============================================================
      # EXTRACT SOURCE
      # ============================================================

      - name: Extract SidePlay
        shell: bash
        run: |
          set -euo pipefail

          rm -rf sideplay-build
          mkdir -p sideplay-build

          echo "Extracting $ZIP_NAME..."
          unzip -q "$ZIP_NAME" -d sideplay-build

          echo ""
          echo "Searching for SidePlay package.json..."

          PACKAGE_JSON="$(
            find sideplay-build \
              -name package.json \
              -not -path '*/node_modules/*' \
              -print -quit
          )"

          if [ -z "$PACKAGE_JSON" ]; then
            echo "::error::package.json not found after extracting SidePlay."
            echo ""
            echo "Extracted contents:"
            find sideplay-build -maxdepth 3 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PACKAGE_JSON")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Detected SidePlay project:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Root contents:"
          ls -lah "$PROJECT_DIR"

      # ============================================================
      # NODE 24
      #
      # Deliberately NO setup-node npm cache here.
      # PROJECT_DIR is dynamically discovered during the previous
      # step, which was causing setup-node cache path resolution
      # failures.
      # ============================================================

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify Node environment
        shell: bash
        run: |
          set -euo pipefail

          echo "Node:"
          node --version

          echo ""
          echo "npm:"
          npm --version

          echo ""
          echo "PROJECT_DIR:"
          echo "$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/package.json" ]; then
            echo "::error::package.json disappeared or PROJECT_DIR is invalid."
            exit 1
          fi

      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # VERIFY SIDEPLAY VERSION
      # ============================================================

      - name: Verify SidePlay version
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          ACTUAL_VERSION="$(node -p "require('./package.json').version")"

          echo "Expected version: $EXPECTED_VERSION"
          echo "Actual version:   $ACTUAL_VERSION"

          if [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::SidePlay version mismatch."
            exit 1
          fi

          echo ""
          echo "SidePlay version verified."

      # ============================================================
      # INSTALL DEPENDENCIES
      # ============================================================

      - name: Install npm dependencies
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          if [ -f package-lock.json ]; then
            echo "package-lock.json found."
            echo "Using npm ci..."
            npm ci
          else
            echo "No package-lock.json found."
            echo "Using npm install..."
            npm install
          fi

      # ============================================================
      # BUILD WEB APP
      # ============================================================

      - name: Build SidePlay web bundle
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "Building SidePlay web application..."
          npm run build

          echo ""
          echo "Web build completed."

      # ============================================================
      # CAPACITOR SYNC
      # ============================================================

      - name: Sync Capacitor Android
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "Syncing Capacitor Android project..."
          npx cap sync android

          echo ""
          echo "Capacitor sync completed."

      # ============================================================
      # VERIFY ANDROID PROJECT
      # ============================================================

      - name: Verify Android project
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          if [ ! -d android ]; then
            echo "::error::android/ directory missing."
            exit 1
          fi

          if [ ! -f android/gradlew ]; then
            echo "::error::android/gradlew missing."
            exit 1
          fi

          chmod +x android/gradlew

          echo "Android project detected."
          echo ""
          echo "Gradle wrapper:"
          ls -lh android/gradlew

      # ============================================================
      # BACKGROUND PLAYBACK SANITY CHECK
      # ============================================================

      - name: Verify Background PlaybackService
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "Searching for PlaybackService.java..."

          PLAYBACK_SERVICE="$(
            find android \
              -type f \
              -name 'PlaybackService.java' \
              -print -quit
          )"

          if [ -z "$PLAYBACK_SERVICE" ]; then
            echo "::error::PlaybackService.java not found after Capacitor sync."
            exit 1
          fi

          echo ""
          echo "PlaybackService found:"
          echo "$PLAYBACK_SERVICE"

          echo ""
          echo "Checking MediaSessionService..."

          if ! grep -q "MediaSessionService" "$PLAYBACK_SERVICE"; then
            echo "::error::PlaybackService does not appear to use MediaSessionService."
            exit 1
          fi

          echo "MediaSessionService detected."

          echo ""
          echo "Checking SidePlay playback service markers..."

          if grep -q "SidePlay/" "$PLAYBACK_SERVICE"; then
            echo "SidePlay playback marker detected."
          else
            echo "::warning::SidePlay user-agent marker not detected."
          fi

          echo ""
          echo "Background playback sanity check passed."

      # ============================================================
      # MANIFEST CHECK
      # ============================================================

      - name: Verify Android playback service registration
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "::error::AndroidManifest.xml not found."
            exit 1
          fi

          echo "Checking AndroidManifest.xml..."

          if grep -q "PlaybackService" "$MANIFEST"; then
            echo "PlaybackService registration detected."
          else
            echo "::warning::PlaybackService string not found in AndroidManifest.xml."
          fi

          if grep -q "FOREGROUND_SERVICE" "$MANIFEST"; then
            echo "Foreground service permission detected."
          else
            echo "::warning::FOREGROUND_SERVICE permission not detected."
          fi

      # ============================================================
      # JAVA + GRADLE DIAGNOSTICS
      # ============================================================

      - name: Android build diagnostics
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " JAVA"
          echo "=========================================="
          java -version

          echo ""
          echo "=========================================="
          echo " GRADLE"
          echo "=========================================="
          ./gradlew --version

          echo ""
          echo "=========================================="
          echo " ANDROID SDK"
          echo "=========================================="
          echo "ANDROID_HOME=${ANDROID_HOME:-not-set}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-not-set}"

      # ============================================================
      # BUILD DEBUG APK
      # ============================================================

      - name: Build SidePlay APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " BUILDING SIDEPLAY"
          echo "=========================================="
          echo ""

          ./gradlew \
            clean \
            assembleDebug \
            --stacktrace \
            --no-daemon

      # ============================================================
      # FIND APK
      # ============================================================

      - name: Locate generated APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "Searching for generated APK..."

          APK="$(
            find android/app/build/outputs/apk \
              -type f \
              -name '*.apk' \
              -print -quit
          )"

          if [ -z "$APK" ]; then
            echo "::error::Gradle completed but no APK was found."

            echo ""
            echo "Build outputs:"
            find android/app/build/outputs -type f 2>/dev/null || true

            exit 1
          fi

          echo ""
          echo "Found APK:"
          echo "$APK"

          mkdir -p release

          OUTPUT_APK="release/SidePlay-v0.9.2-r10.2-BACKGROUND-SURVIVAL.apk"

          cp "$APK" "$OUTPUT_APK"

          echo "APK_PATH=$PROJECT_DIR/$OUTPUT_APK" >> "$GITHUB_ENV"

          echo ""
          echo "Final APK:"
          ls -lh "$OUTPUT_APK"

      # ============================================================
      # APK INFORMATION
      # ============================================================

      - name: APK build summary
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " SIDEPLAY BUILD COMPLETE"
          echo "=========================================="
          echo ""
          echo "Version:"
          echo "$EXPECTED_VERSION"

          echo ""
          echo "APK:"
          echo "$APK_PATH"

          echo ""
          echo "Size:"
          du -h "$APK_PATH"

          echo ""
          echo "SHA-256:"
          sha256sum "$APK_PATH"

      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload SidePlay APK
        uses: actions/upload-artifact@v4
        with:
          name: SidePlay-v0.9.2-r10.2-BACKGROUND-SURVIVAL
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30
