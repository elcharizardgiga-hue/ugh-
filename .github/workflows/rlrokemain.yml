name: SidePlay R10.2 — Background Survival APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build SidePlay v0.9.2-r10.2
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ZIP_NAME: SidePlay-v0.9.2-R10.2-BACKGROUND-SURVIVAL.zip
      EXPECTED_VERSION: 0.9.2-r10.2

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # VERIFY SOURCE ZIP
      # ============================================================

      - name: Verify SidePlay source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " SIDEPLAY R10.2 — BACKGROUND SURVIVAL"
          echo "=========================================="
          echo ""

          if [ ! -f "$ZIP_NAME" ]; then
            echo "::error::Could not find $ZIP_NAME"
            echo ""
            echo "Repository contents:"
            ls -lah
            exit 1
          fi

          echo "Source ZIP found:"
          ls -lh "$ZIP_NAME"


      # ============================================================
      # EXTRACT
      # ============================================================

      - name: Extract SidePlay
        shell: bash
        run: |
          set -euo pipefail

          rm -rf sideplay-build
          mkdir -p sideplay-build

          unzip -q "$ZIP_NAME" -d sideplay-build

          PACKAGE_JSON="$(
            find sideplay-build \
              -name package.json \
              -not -path '*/node_modules/*' \
              -print -quit
          )"

          if [ -z "$PACKAGE_JSON" ]; then
            echo "::error::package.json not found."
            find sideplay-build -maxdepth 3 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PACKAGE_JSON")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "SidePlay project:"
          echo "$PROJECT_DIR"

          echo ""
          ls -lah "$PROJECT_DIR"


      # ============================================================
      # NODE 24
      # ============================================================

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"


      - name: Verify Node
        shell: bash
        run: |
          set -euo pipefail

          echo "Node:"
          node --version

          echo ""
          echo "npm:"
          npm --version

          echo ""
          echo "PROJECT_DIR=$PROJECT_DIR"

          test -f "$PROJECT_DIR/package.json"


      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Verify Java
        shell: bash
        run: |
          set -euo pipefail
          java -version


      # ============================================================
      # ANDROID SDK
      #
      # Do NOT run setup-android/sdkmanager.
      # ubuntu-latest already contains Android SDK.
      # ============================================================

      - name: Detect GitHub Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " ANDROID SDK"
          echo "=========================================="

          SDK=""

          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ]; then
            SDK="$ANDROID_HOME"

          elif [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK="$ANDROID_SDK_ROOT"

          elif [ -d "/usr/local/lib/android/sdk" ]; then
            SDK="/usr/local/lib/android/sdk"

          else
            echo "::error::Android SDK not found."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo ""
          echo "Using:"
          echo "$SDK"

          echo ""
          echo "Platforms:"
          ls -1 "$SDK/platforms" || true

          echo ""
          echo "Build tools:"
          ls -1 "$SDK/build-tools" || true


      # ============================================================
      # VERIFY VERSION
      # ============================================================

      - name: Verify SidePlay version
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          ACTUAL_VERSION="$(
            node -p "require('./package.json').version"
          )"

          echo "Expected: $EXPECTED_VERSION"
          echo "Actual:   $ACTUAL_VERSION"

          if [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::SidePlay version mismatch."
            exit 1
          fi

          echo ""
          echo "Version OK."


      # ============================================================
      # NPM INSTALL
      # ============================================================

      - name: Install dependencies
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " NPM INSTALL"
          echo "=========================================="

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi


      # ============================================================
      # VERIFY CAPACITOR PACKAGES
      # ============================================================

      - name: Verify Capacitor
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "Capacitor CLI:"
          npx cap --version

          echo ""
          echo "Capacitor config:"

          if [ -f capacitor.config.ts ]; then
            echo "capacitor.config.ts"
          elif [ -f capacitor.config.js ]; then
            echo "capacitor.config.js"
          elif [ -f capacitor.config.json ]; then
            echo "capacitor.config.json"
          else
            echo "::error::Capacitor configuration missing."
            exit 1
          fi

          echo ""
          echo "Checking @capacitor/android..."

          node -e "
          try {
            console.log(
              require('@capacitor/android/package.json').version
            );
          } catch (e) {
            console.error('@capacitor/android is missing');
            process.exit(1);
          }
          "


      # ============================================================
      # WEB BUILD
      # ============================================================

      - name: Build SidePlay web app
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " WEB BUILD"
          echo "=========================================="

          npm run build


      # ============================================================
      # BACKUP NATIVE SOURCES
      #
      # We do this BEFORE touching android/.
      # ============================================================

      - name: Discover SidePlay native Android sources
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " SIDEPPLAY NATIVE SOURCES"
          echo "=========================================="

          echo ""
          echo "Native directory contents:"

          find native -maxdepth 5 -type f 2>/dev/null || true

          PLAYBACK_SOURCE="$(
            find native \
              -type f \
              -name 'PlaybackService.java' \
              -print -quit 2>/dev/null || true
          )"

          if [ -z "$PLAYBACK_SOURCE" ]; then
            echo "::error::native PlaybackService.java not found."
            exit 1
          fi

          echo ""
          echo "PlaybackService source:"
          echo "$PLAYBACK_SOURCE"

          NATIVE_JAVA_DIR="$(dirname "$PLAYBACK_SOURCE")"

          echo "NATIVE_JAVA_DIR=$NATIVE_JAVA_DIR" \
            >> "$GITHUB_ENV"

          PACKAGE="$(
            grep -m1 '^package ' "$PLAYBACK_SOURCE" \
              | sed 's/^package //' \
              | sed 's/;//' \
              | tr -d '\r'
          )"

          if [ -z "$PACKAGE" ]; then
            echo "::error::Could not determine Java package."
            exit 1
          fi

          echo ""
          echo "Java package:"
          echo "$PACKAGE"

          PACKAGE_PATH="$(echo "$PACKAGE" | tr '.' '/')"

          echo "NATIVE_PACKAGE=$PACKAGE" \
            >> "$GITHUB_ENV"

          echo "NATIVE_PACKAGE_PATH=$PACKAGE_PATH" \
            >> "$GITHUB_ENV"

          echo ""
          echo "Native Java files:"

          find "$NATIVE_JAVA_DIR" \
            -maxdepth 1 \
            -type f \
            -name '*.java' \
            -print


      # ============================================================
      # CREATE ANDROID PLATFORM IF MISSING
      # ============================================================

      - name: Ensure Capacitor Android platform exists
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " ANDROID PLATFORM"
          echo "=========================================="

          if [ -f android/app/build.gradle ] || \
             [ -f android/app/build.gradle.kts ]; then

            echo "Existing Capacitor Android platform found."

          else

            echo "Android platform is missing."
            echo "Creating it now..."

            rm -rf android

            npx cap add android

            echo ""
            echo "Android platform created."

          fi

          if [ ! -d android ]; then
            echo "::error::Capacitor failed to create android/."
            exit 1
          fi

          if [ ! -f android/gradlew ]; then
            echo "::error::Gradle wrapper missing."
            exit 1
          fi

          chmod +x android/gradlew


      # ============================================================
      # CAPACITOR SYNC
      # ============================================================

      - name: Sync Capacitor Android
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " CAPACITOR SYNC"
          echo "=========================================="

          npx cap sync android

          echo ""
          echo "Capacitor sync complete."


      # ============================================================
      # RESTORE CUSTOM SIDEPPLAY JAVA
      #
      # Important: AFTER cap sync.
      # ============================================================

      - name: Restore SidePlay native Android code
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " RESTORE NATIVE PLAYBACK ENGINE"
          echo "=========================================="

          TARGET_DIR="android/app/src/main/java/$NATIVE_PACKAGE_PATH"

          mkdir -p "$TARGET_DIR"

          echo ""
          echo "Source:"
          echo "$NATIVE_JAVA_DIR"

          echo ""
          echo "Destination:"
          echo "$TARGET_DIR"

          echo ""
          echo "Copying Java sources..."

          find "$NATIVE_JAVA_DIR" \
            -maxdepth 1 \
            -type f \
            -name '*.java' \
            -exec cp -v {} "$TARGET_DIR/" \;

          echo ""
          echo "Installed SidePlay native sources:"

          find "$TARGET_DIR" \
            -maxdepth 1 \
            -type f \
            -name '*.java' \
            -print


      # ============================================================
      # VERIFY PLAYBACK SERVICE SURVIVED
      # ============================================================

      - name: Verify SidePlay PlaybackService
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " PLAYBACK SERVICE CHECK"
          echo "=========================================="

          PLAYBACK_SERVICE="$(
            find android/app/src/main/java \
              -type f \
              -name 'PlaybackService.java' \
              -print -quit
          )"

          if [ -z "$PLAYBACK_SERVICE" ]; then
            echo "::error::PlaybackService.java missing from Android project."
            exit 1
          fi

          echo "Found:"
          echo "$PLAYBACK_SERVICE"

          echo ""

          if grep -q "MediaSessionService" "$PLAYBACK_SERVICE"; then
            echo "[OK] MediaSessionService"
          else
            echo "::error::MediaSessionService implementation missing."
            exit 1
          fi

          if grep -q "SidePlay/" "$PLAYBACK_SERVICE"; then
            echo "[OK] SidePlay playback marker"
          else
            echo "::warning::SidePlay user-agent marker missing."
          fi

          echo ""
          echo "PlaybackService check passed."


      # ============================================================
      # MANIFEST
      # ============================================================

      - name: Inspect Android Manifest
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          echo "=========================================="
          echo " ANDROID MANIFEST"
          echo "=========================================="

          if [ ! -f "$MANIFEST" ]; then
            echo "::error::AndroidManifest.xml missing."
            exit 1
          fi

          echo ""
          echo "PlaybackService registration:"

          if grep -q "PlaybackService" "$MANIFEST"; then
            echo "[OK] PlaybackService registered"
          else
            echo "::warning::PlaybackService not currently registered in manifest."
          fi

          echo ""
          echo "Foreground service permission:"

          if grep -q "FOREGROUND_SERVICE" "$MANIFEST"; then
            echo "[OK] FOREGROUND_SERVICE"
          else
            echo "::warning::FOREGROUND_SERVICE missing."
          fi

          echo ""
          echo "WAKE_LOCK:"

          if grep -q "WAKE_LOCK" "$MANIFEST"; then
            echo "[OK] WAKE_LOCK"
          else
            echo "::warning::WAKE_LOCK missing."
          fi


      # ============================================================
      # LOCAL.PROPERTIES
      # ============================================================

      - name: Configure Android SDK for Gradle
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          set -euo pipefail

          echo "sdk.dir=$ANDROID_HOME" > local.properties

          echo "local.properties:"
          cat local.properties


      # ============================================================
      # GRADLE INFO
      # ============================================================

      - name: Gradle diagnostics
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " JAVA"
          echo "=========================================="

          java -version

          echo ""
          echo "=========================================="
          echo " GRADLE"
          echo "=========================================="

          ./gradlew --version

          echo ""
          echo "=========================================="
          echo " SDK"
          echo "=========================================="

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""

          cat local.properties


      # ============================================================
      # BUILD APK
      # ============================================================

      - name: Build SidePlay APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " BUILDING SIDEPLAY"
          echo "=========================================="
          echo ""

          ./gradlew \
            clean \
            assembleDebug \
            --stacktrace \
            --no-daemon


      # ============================================================
      # LOCATE APK
      # ============================================================

      - name: Locate generated APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " FIND APK"
          echo "=========================================="

          APK="$(
            find android/app/build/outputs/apk \
              -type f \
              -name '*.apk' \
              -print -quit
          )"

          if [ -z "$APK" ]; then
            echo "::error::No APK produced."

            echo ""
            echo "Build outputs:"

            find android/app/build/outputs \
              -type f \
              2>/dev/null || true

            exit 1
          fi

          mkdir -p release

          OUTPUT_APK="release/SidePlay-v0.9.2-r10.2-BACKGROUND-SURVIVAL.apk"

          cp "$APK" "$OUTPUT_APK"

          ABSOLUTE_APK="$PROJECT_DIR/$OUTPUT_APK"

          echo "APK_PATH=$ABSOLUTE_APK" >> "$GITHUB_ENV"

          echo ""
          echo "APK:"
          ls -lh "$OUTPUT_APK"


      # ============================================================
      # SUMMARY
      # ============================================================

      - name: SidePlay build summary
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "=========================================="
          echo "       SIDEPLAY BUILD COMPLETE"
          echo "=========================================="
          echo ""

          echo "Version:"
          echo "$EXPECTED_VERSION"

          echo ""
          echo "APK:"
          echo "$APK_PATH"

          echo ""
          echo "Size:"
          du -h "$APK_PATH"

          echo ""
          echo "SHA-256:"
          sha256sum "$APK_PATH"


      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload SidePlay APK
        uses: actions/upload-artifact@v4
        with:
          name: SidePlay-v0.9.2-r10.2-BACKGROUND-SURVIVAL
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30
