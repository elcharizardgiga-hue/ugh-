name: SidePlay v0.8.1 — STAY INSIDE APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v0.8.1'

permissions:
  contents: write

jobs:
  build:
    name: SidePlay 0.8.1 — stay-inside native playback
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Show EXACT workflow/run
        shell: bash
        run: |
          echo "WORKFLOW: $GITHUB_WORKFLOW"
          echo "RUN NUMBER: $GITHUB_RUN_NUMBER"
          echo "REF: $GITHUB_REF"
          echo "COMMIT: $GITHUB_SHA"
          echo "Workflow files currently in repo:"
          find .github/workflows -maxdepth 1 -type f -print 2>/dev/null || true

      - name: Prepare EXACT SidePlay v0.8.1 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf sideplay release signing
          mkdir -p sideplay

          # Prefer the exact v0.8.1 archive so stale expanded Android state cannot leak in.
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'SidePlay-Node-v0.8.1-STAY-INSIDE-BACKGROUND.zip' -printf '%f\n' | head -n 1)"

          if [ -n "${ZIP_FILE:-}" ] && [ -f "$ZIP_FILE" ]; then
            echo "Using EXACT archive: $ZIP_FILE"
            unzip -q "$ZIP_FILE" -d sideplay
          elif [ -f package.json ] && [ -f src/App.tsx ] && [ -f scripts/patch-android.mjs ]; then
            echo "Using expanded source — but deliberately NOT copying android/"
            rsync -a \
              --exclude '.git' \
              --exclude '.github' \
              --exclude 'android' \
              --exclude 'sideplay' \
              --exclude 'release' \
              --exclude 'signing' \
              --exclude 'node_modules' \
              --exclude 'dist' \
              ./ sideplay/
          else
            echo "ERROR: SidePlay v0.8.1 source not found."
            echo "Put SidePlay-Node-v0.8.1-STAY-INSIDE-BACKGROUND.zip in repo root."
            exit 1
          fi

          test -f sideplay/package.json
          test -f sideplay/src/App.tsx
          test -f sideplay/scripts/patch-android.mjs
          test -f sideplay/native/android/PlaybackService.java
          test -f sideplay/native/android/YtDlpPlugin.java

          VERSION="$(node -p "require('./sideplay/package.json').version")"
          echo "SOURCE VERSION = $VERSION"
          test "$VERSION" = "0.8.1"

          # Absolutely refuse any stale generated Android shell from the archive/source.
          rm -rf sideplay/android

          echo "✅ Clean SidePlay 0.8.1 source prepared"

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install JS dependencies
        working-directory: sideplay
        run: npm install --no-audit --no-fund

      - name: Build SidePlay web app
        working-directory: sideplay
        run: npm run build

      - name: Generate BRAND-NEW Android shell
        working-directory: sideplay
        shell: bash
        run: |
          set -euo pipefail
          test ! -d android
          npx cap add android
          npx cap sync android
          echo "✅ Fresh Capacitor Android project generated"

      - name: Apply SidePlay native engine patches
        working-directory: sideplay
        shell: bash
        run: |
          set -euo pipefail
          node scripts/patch-android.mjs

          test -f android/app/src/main/java/app/sideplay/mobile/MainActivity.java
          test -f android/app/src/main/java/app/sideplay/mobile/PlaybackService.java
          test -f android/app/src/main/java/app/sideplay/mobile/BackgroundAudioPlugin.java
          test -f android/app/src/main/java/app/sideplay/mobile/YtDlpPlugin.java
          test -f android/app/src/main/java/app/sideplay/mobile/MediaSafety.java

          grep -q 'youtubedl-android:library:0.18.1' android/app/build.gradle
          grep -q 'youtubedl-android:ffmpeg:0.18.1' android/app/build.gradle
          grep -q 'android:foregroundServiceType="mediaPlayback"' android/app/src/main/AndroidManifest.xml
          grep -q 'androidx.media3.session.MediaButtonReceiver' android/app/src/main/AndroidManifest.xml

      - name: FORCE Android APK version to 0.8.1
        working-directory: sideplay
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('android/app/build.gradle')
          s = p.read_text()

          s2, n_code = re.subn(r'(?m)^(\s*)versionCode\s+\d+\s*$', r'\1versionCode 801', s, count=1)
          s3, n_name = re.subn(r'(?m)^(\s*)versionName\s+["\'][^"\']+["\']\s*$', r'\1versionName "0.8.1"', s2, count=1)

          if n_code != 1 or n_name != 1:
              raise SystemExit(f'Could not force Android version metadata: versionCode replacements={n_code}, versionName replacements={n_name}')

          p.write_text(s3)
          PY

          grep -n 'versionCode 801' android/app/build.gradle
          grep -n 'versionName "0.8.1"' android/app/build.gradle
          echo "✅ Android version metadata forced to 0.8.1 / 801"

      - name: Build CLEAN release APK
        working-directory: sideplay/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:clean :app:assembleRelease --stacktrace --no-daemon

      - name: Locate unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find sideplay/android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*-release-unsigned.apk' | head -n 1)"
          test -n "${APK:-}"
          test -f "$APK"
          mkdir -p signing release
          cp "$APK" signing/SidePlay-v0.8.1-unsigned.apk

      - name: Prepare signing key
        id: signing
        shell: bash
        env:
          SIDEPLAY_KEYSTORE_B64: ${{ secrets.SIDEPLAY_KEYSTORE_B64 }}
          SIDEPLAY_KEYSTORE_PASSWORD: ${{ secrets.SIDEPLAY_KEYSTORE_PASSWORD }}
          SIDEPLAY_KEY_ALIAS: ${{ secrets.SIDEPLAY_KEY_ALIAS }}
          SIDEPLAY_KEY_PASSWORD: ${{ secrets.SIDEPLAY_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -n "${SIDEPLAY_KEYSTORE_B64:-}" ] && [ -n "${SIDEPLAY_KEYSTORE_PASSWORD:-}" ] && [ -n "${SIDEPLAY_KEY_ALIAS:-}" ] && [ -n "${SIDEPLAY_KEY_PASSWORD:-}" ]; then
            echo "$SIDEPLAY_KEYSTORE_B64" | base64 --decode > signing/sideplay.jks
            echo "stable=true" >> "$GITHUB_OUTPUT"
            echo "SIDEPLAY_SIGN_KS_PASS=$SIDEPLAY_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SIDEPLAY_SIGN_KEY_ALIAS=$SIDEPLAY_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "SIDEPLAY_SIGN_KEY_PASS=$SIDEPLAY_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "✅ Persistent signing key loaded"
          else
            keytool -genkeypair -v \
              -keystore signing/sideplay.jks \
              -storepass sideplay123 \
              -keypass sideplay123 \
              -alias sideplay \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=SidePlay CI, OU=Testing, O=SidePlay, C=DO"

            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "SIDEPLAY_SIGN_KS_PASS=sideplay123" >> "$GITHUB_ENV"
            echo "SIDEPLAY_SIGN_KEY_ALIAS=sideplay" >> "$GITHUB_ENV"
            echo "SIDEPLAY_SIGN_KEY_PASS=sideplay123" >> "$GITHUB_ENV"
            echo "⚠️ Temporary signing key used"
          fi

      - name: Zipalign APK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -f -p 4 \
            signing/SidePlay-v0.8.1-unsigned.apk \
            signing/SidePlay-v0.8.1-aligned.apk

      - name: Sign APK
        shell: bash
        run: |
          set -euo pipefail
          OUT="release/SidePlay-v0.8.1-RUN-${GITHUB_RUN_NUMBER}.apk"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" sign \
            --ks signing/sideplay.jks \
            --ks-key-alias "$SIDEPLAY_SIGN_KEY_ALIAS" \
            --ks-pass "pass:$SIDEPLAY_SIGN_KS_PASS" \
            --key-pass "pass:$SIDEPLAY_SIGN_KEY_PASS" \
            --out "$OUT" \
            signing/SidePlay-v0.8.1-aligned.apk
          echo "APK_PATH=$OUT" >> "$GITHUB_ENV"

      - name: PROVE final APK is 0.8.1 — or FAIL
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign"
          AAPT2="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2"

          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH"
          "$ZIPALIGN" -c -v 4 "$APK_PATH"
          "$AAPT2" dump badging "$APK_PATH" | tee release/APK_BADGING.txt

          grep -q "package: name='app.sideplay.mobile'" release/APK_BADGING.txt
          grep -q "versionCode='801'" release/APK_BADGING.txt
          grep -q "versionName='0.8.1'" release/APK_BADGING.txt

          sha256sum "$APK_PATH" | tee release/SHA256.txt

          cat > release/THIS_IS_THE_ONE.txt <<EOF
          THIS IS SIDEPLAY v0.8.1
          GitHub run: $GITHUB_RUN_NUMBER
          Commit: $GITHUB_SHA
          APK: $(basename "$APK_PATH")
          Android versionName: 0.8.1
          Android versionCode: 801
          EOF

          echo "========================================================"
          echo " VERIFIED APK VERSION NAME: 0.8.1"
          echo " VERIFIED APK VERSION CODE: 801"
          echo " APK: $(basename "$APK_PATH")"
          echo "========================================================"

      - name: Upload THE ONLY artifact you should download
        uses: actions/upload-artifact@v4
        with:
          name: USE_THIS__SIDEPLAY_0.8.1_STAY_INSIDE__RUN-${{ github.run_number }}
          path: |
            ${{ env.APK_PATH }}
            release/SHA256.txt
            release/APK_BADGING.txt
            release/THIS_IS_THE_ONE.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish/refresh v0.8.1 Release and MARK IT LATEST
        if: github.ref == 'refs/tags/v0.8.1' && steps.signing.outputs.stable == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view v0.8.1 >/dev/null 2>&1; then
            gh release upload v0.8.1 \
              "$APK_PATH" \
              release/SHA256.txt \
              release/APK_BADGING.txt \
              release/THIS_IS_THE_ONE.txt \
              --clobber
            gh release edit v0.8.1 --latest
          else
            gh release create v0.8.1 \
              "$APK_PATH" \
              release/SHA256.txt \
              release/APK_BADGING.txt \
              release/THIS_IS_THE_ONE.txt \
              --title "SidePlay v0.8.1" \
              --generate-notes \
              --latest
          fi

          echo "✅ v0.8.1 is explicitly marked as GitHub Latest release"
          
