name: SidePlay R10.2 — Background Survival FIXED

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build SidePlay v0.9.2-r10.2
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ZIP_NAME: SidePlay-v0.9.2-R10.2-BACKGROUND-SURVIVAL-FIXED.zip
      EXPECTED_VERSION: 0.9.2-r10.2

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # VERIFY ZIP
      # ============================================================

      - name: Verify SidePlay ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " SIDEPLAY R10.2 — BACKGROUND SURVIVAL"
          echo "=========================================="
          echo ""

          if [ ! -f "$ZIP_NAME" ]; then
            echo "::error::Could not find $ZIP_NAME"
            echo ""
            echo "Repository contents:"
            ls -lah
            exit 1
          fi

          echo "[OK] Source ZIP found:"
          ls -lh "$ZIP_NAME"


      # ============================================================
      # EXTRACT
      # ============================================================

      - name: Extract SidePlay
        shell: bash
        run: |
          set -euo pipefail

          rm -rf sideplay-build
          mkdir -p sideplay-build

          echo "Extracting:"
          echo "$ZIP_NAME"
          echo ""

          unzip -q "$ZIP_NAME" -d sideplay-build

          PACKAGE_JSON="$(
            find sideplay-build \
              -name package.json \
              -not -path '*/node_modules/*' \
              -print -quit
          )"

          if [ -z "$PACKAGE_JSON" ]; then
            echo "::error::package.json not found after extraction."
            echo ""
            find sideplay-build -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PACKAGE_JSON")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "[OK] Project directory:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Project contents:"
          ls -lah "$PROJECT_DIR"


      # ============================================================
      # NODE 24
      # ============================================================

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"


      - name: Verify Node
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " NODE"
          echo "=========================================="

          node --version
          npm --version

          echo ""
          echo "PROJECT_DIR=$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/package.json" ]; then
            echo "::error::Invalid PROJECT_DIR."
            exit 1
          fi


      # ============================================================
      # JAVA 21
      #
      # IMPORTANT:
      # Capacitor Android generated project requires Java 21.
      # ============================================================

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"


      - name: Prove Java 21 is active
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " JAVA 21 CHECK"
          echo "=========================================="

          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          echo ""
          echo "java:"
          java -version

          echo ""
          echo "javac:"
          javac -version

          JAVA_MAJOR="$(
            javac -version 2>&1 \
              | awk '{print $2}' \
              | cut -d. -f1
          )"

          echo ""
          echo "Detected javac major:"
          echo "$JAVA_MAJOR"

          if [ "$JAVA_MAJOR" != "21" ]; then
            echo "::error::JDK 21 is NOT active."
            echo "::error::javac reports: $(javac -version 2>&1)"
            exit 1
          fi

          echo ""
          echo "[OK] Java 21 is ACTIVE."


      # ============================================================
      # ANDROID SDK
      #
      # We intentionally DO NOT use android-actions/setup-android.
      # GitHub ubuntu-latest already contains Android SDK.
      # ============================================================

      - name: Detect Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " ANDROID SDK"
          echo "=========================================="

          SDK=""

          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ]; then

            SDK="$ANDROID_HOME"

          elif [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -d "$ANDROID_SDK_ROOT" ]; then

            SDK="$ANDROID_SDK_ROOT"

          elif [ -d "/usr/local/lib/android/sdk" ]; then

            SDK="/usr/local/lib/android/sdk"

          else

            echo "::error::Android SDK not found on GitHub runner."
            exit 1

          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo ""
          echo "Android SDK:"
          echo "$SDK"

          echo ""
          echo "Installed platforms:"

          if [ -d "$SDK/platforms" ]; then
            ls -1 "$SDK/platforms"
          else
            echo "::error::Android platforms directory missing."
            exit 1
          fi

          echo ""
          echo "Installed build-tools:"

          if [ -d "$SDK/build-tools" ]; then
            ls -1 "$SDK/build-tools"
          else
            echo "::error::Android build-tools directory missing."
            exit 1
          fi

          echo ""
          echo "[OK] Android SDK detected."


      # ============================================================
      # VERSION CHECK
      # ============================================================

      - name: Verify SidePlay version
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " VERSION CHECK"
          echo "=========================================="

          ACTUAL_VERSION="$(
            node -p "require('./package.json').version"
          )"

          echo "Expected: $EXPECTED_VERSION"
          echo "Actual:   $ACTUAL_VERSION"

          if [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::SidePlay version mismatch."
            exit 1
          fi

          echo ""
          echo "[OK] SidePlay $ACTUAL_VERSION"


      # ============================================================
      # INSTALL DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " NPM INSTALL"
          echo "=========================================="

          if [ -f package-lock.json ]; then

            echo "package-lock.json detected."
            echo "Running npm ci..."
            npm ci

          else

            echo "No package-lock.json."
            echo "Running npm install..."
            npm install

          fi

          echo ""
          echo "[OK] Dependencies installed."


      # ============================================================
      # VERIFY CAPACITOR
      # ============================================================

      - name: Verify Capacitor
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " CAPACITOR"
          echo "=========================================="

          echo "Capacitor CLI:"
          npx cap --version

          echo ""
          echo "Checking config..."

          if [ -f capacitor.config.ts ]; then
            echo "[OK] capacitor.config.ts"

          elif [ -f capacitor.config.js ]; then
            echo "[OK] capacitor.config.js"

          elif [ -f capacitor.config.json ]; then
            echo "[OK] capacitor.config.json"

          else
            echo "::error::Capacitor config missing."
            exit 1
          fi

          echo ""
          echo "Checking @capacitor/android..."

          node -e "
          try {
            const p = require('@capacitor/android/package.json');
            console.log('[OK] @capacitor/android ' + p.version);
          } catch (e) {
            console.error('@capacitor/android is missing');
            process.exit(1);
          }
          "


      # ============================================================
      # CORE TESTS
      # ============================================================

      - name: Run SidePlay core tests
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " CORE TESTS"
          echo "=========================================="

          npm run test:core

          echo ""
          echo "[OK] Core tests passed."


      # ============================================================
      # WEB BUILD
      # ============================================================

      - name: Build SidePlay web app
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " WEB BUILD"
          echo "=========================================="

          npm run build

          echo ""
          echo "[OK] Web build complete."


      # ============================================================
      # ANDROID PREP
      #
      # FIXED ZIP COMMAND:
      #
      # cap add android
      # cap sync android
      # patch-android.mjs
      # restore native SidePlay engine
      # PlaybackService
      # MainActivity
      # Media3
      # NewPipe
      # yt-dlp
      # Manifest
      # Gradle dependencies
      # ============================================================

      - name: Prepare SidePlay Android
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " SIDEPLAY ANDROID PREP"
          echo "=========================================="

          npm run android:prepare

          echo ""
          echo "[OK] Android platform prepared."


      # ============================================================
      # VERIFY GENERATED ANDROID PROJECT
      # ============================================================

      - name: Verify generated Android project
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " VERIFY ANDROID PROJECT"
          echo "=========================================="

          if [ ! -d android ]; then
            echo "::error::android/ missing."
            exit 1
          fi

          if [ ! -f android/gradlew ]; then
            echo "::error::android/gradlew missing."
            exit 1
          fi

          chmod +x android/gradlew

          echo "[OK] Gradle wrapper"

          PLAYBACK_SERVICE="$(
            find android/app/src/main \
              -type f \
              -name 'PlaybackService.java' \
              -print -quit
          )"

          if [ -z "$PLAYBACK_SERVICE" ]; then
            echo "::error::PlaybackService.java missing."
            exit 1
          fi

          echo ""
          echo "PlaybackService:"
          echo "$PLAYBACK_SERVICE"

          if ! grep -q "MediaSessionService" "$PLAYBACK_SERVICE"; then
            echo "::error::PlaybackService does not use MediaSessionService."
            exit 1
          fi

          echo "[OK] MediaSessionService"

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "::error::AndroidManifest.xml missing."
            exit 1
          fi

          if ! grep -q "PlaybackService" "$MANIFEST"; then
            echo "::error::PlaybackService is not registered in manifest."
            exit 1
          fi

          echo "[OK] PlaybackService manifest registration"

          if grep -q "FOREGROUND_SERVICE" "$MANIFEST"; then
            echo "[OK] FOREGROUND_SERVICE permission"
          else
            echo "::warning::FOREGROUND_SERVICE permission not found."
          fi

          if grep -q "WAKE_LOCK" "$MANIFEST"; then
            echo "[OK] WAKE_LOCK permission"
          else
            echo "::warning::WAKE_LOCK permission not found."
          fi

          echo ""
          echo "[OK] SidePlay native engine present."


      # ============================================================
      # LOCAL.PROPERTIES
      # ============================================================

      - name: Configure Android SDK for Gradle
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          set -euo pipefail

          echo "sdk.dir=$ANDROID_HOME" > local.properties

          echo "=========================================="
          echo " LOCAL.PROPERTIES"
          echo "=========================================="

          cat local.properties


      # ============================================================
      # CRITICAL JAVA 21 / GRADLE CHECK
      #
      # If GitHub somehow switches back to JDK 17, STOP HERE.
      # ============================================================

      - name: Verify Gradle is REALLY using Java 21
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " JAVA / GRADLE TOOLCHAIN CHECK"
          echo "=========================================="

          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          echo ""
          echo "java:"
          java -version

          echo ""
          echo "javac:"
          javac -version

          echo ""
          echo "Gradle:"
          ./gradlew --version

          echo ""

          JAVA_MAJOR="$(
            javac -version 2>&1 \
              | awk '{print $2}' \
              | cut -d. -f1
          )"

          if [ "$JAVA_MAJOR" != "21" ]; then
            echo "::error::JDK 21 was lost before Gradle build."
            echo "::error::Current javac: $(javac -version 2>&1)"
            exit 1
          fi

          echo ""
          echo "Stopping any stale Gradle daemon..."

          ./gradlew --stop || true

          echo ""
          echo "[OK] javac 21"
          echo "[OK] Gradle environment verified."


      # ============================================================
      # BUILD APK
      # ============================================================

      - name: Build SidePlay APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}/android
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " BUILD SIDEPLAY APK"
          echo "=========================================="

          echo ""
          echo "Final Java check:"
          java -version
          javac -version

          echo ""
          echo "Starting Gradle..."

          ./gradlew \
            clean \
            assembleDebug \
            --stacktrace \
            --no-daemon

          echo ""
          echo "[OK] Gradle build completed."


      # ============================================================
      # FIND APK
      # ============================================================

      - name: Collect SidePlay APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " COLLECT APK"
          echo "=========================================="

          APK="$(
            find android/app/build/outputs/apk \
              -type f \
              -name '*.apk' \
              -print -quit
          )"

          if [ -z "$APK" ]; then
            echo "::error::Gradle completed but no APK was found."

            echo ""
            echo "Build outputs:"

            find android/app/build/outputs \
              -type f \
              2>/dev/null || true

            exit 1
          fi

          echo ""
          echo "Generated APK:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/release"

          FINAL_APK="$GITHUB_WORKSPACE/release/SidePlay-v0.9.2-r10.2-BACKGROUND-SURVIVAL-FIXED.apk"

          cp "$APK" "$FINAL_APK"

          echo "FINAL_APK=$FINAL_APK" >> "$GITHUB_ENV"

          echo ""
          echo "[OK] Final APK:"
          ls -lh "$FINAL_APK"


      # ============================================================
      # SUMMARY
      # ============================================================

      - name: Build summary
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "=========================================="
          echo "       SIDEPLAY BUILD COMPLETE"
          echo "=========================================="
          echo ""

          echo "Version:"
          echo "$EXPECTED_VERSION"

          echo ""
          echo "APK:"
          echo "$FINAL_APK"

          echo ""
          echo "Size:"
          du -h "$FINAL_APK"

          echo ""
          echo "SHA-256:"
          sha256sum "$FINAL_APK"

          echo ""
          echo "=========================================="
          echo "             BRRRRRRRRR"
          echo "=========================================="


      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload SidePlay APK
        uses: actions/upload-artifact@v4
        with:
          name: SidePlay-v0.9.2-r10.2-BACKGROUND-SURVIVAL-FIXED
          path: release/SidePlay-v0.9.2-r10.2-BACKGROUND-SURVIVAL-FIXED.apk
          if-no-files-found: error
          retention-days: 30
