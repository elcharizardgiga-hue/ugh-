name: SidePlay R10.2 — Background Survival FIXED

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build SidePlay v0.9.2-r10.2
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ZIP_NAME: SidePlay-v0.9.2-R10.2-BACKGROUND-SURVIVAL-FIXED.zip
      EXPECTED_VERSION: 0.9.2-r10.2

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # VERIFY ZIP
      # ============================================================

      - name: Verify SidePlay source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " SIDEPLAY R10.2 — BACKGROUND SURVIVAL"
          echo "=========================================="
          echo ""

          if [ ! -f "$ZIP_NAME" ]; then
            echo "::error::Could not find $ZIP_NAME"
            echo ""
            echo "Repository contents:"
            ls -lah
            exit 1
          fi

          echo "Source ZIP found:"
          ls -lh "$ZIP_NAME"


      # ============================================================
      # EXTRACT
      # ============================================================

      - name: Extract SidePlay
        shell: bash
        run: |
          set -euo pipefail

          rm -rf sideplay-build
          mkdir -p sideplay-build

          unzip -q "$ZIP_NAME" -d sideplay-build

          PACKAGE_JSON="$(
            find sideplay-build \
              -name package.json \
              -not -path '*/node_modules/*' \
              -print -quit
          )"

          if [ -z "$PACKAGE_JSON" ]; then
            echo "::error::package.json not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PACKAGE_JSON")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo ""
          ls -lah "$PROJECT_DIR"


      # ============================================================
      # NODE
      # ============================================================

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"


      - name: Verify Node
        shell: bash
        run: |
          set -euo pipefail

          echo "Node:"
          node --version

          echo ""
          echo "npm:"
          npm --version


      # ============================================================
      # JAVA
      # ============================================================

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Detect Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK=""

          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ]; then
            SDK="$ANDROID_HOME"

          elif [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK="$ANDROID_SDK_ROOT"

          elif [ -d "/usr/local/lib/android/sdk" ]; then
            SDK="/usr/local/lib/android/sdk"

          else
            echo "::error::Android SDK not found."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "Android SDK:"
          echo "$SDK"

          echo ""
          echo "Platforms:"
          ls -1 "$SDK/platforms" || true

          echo ""
          echo "Build tools:"
          ls -1 "$SDK/build-tools" || true


      # ============================================================
      # VERIFY VERSION
      # ============================================================

      - name: Verify SidePlay version
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          ACTUAL_VERSION="$(node -p "require('./package.json').version")"

          echo "Expected: $EXPECTED_VERSION"
          echo "Actual:   $ACTUAL_VERSION"

          if [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::Version mismatch."
            exit 1
          fi

          echo ""
          echo "[OK] SidePlay $ACTUAL_VERSION"


      # ============================================================
      # INSTALL
      # ============================================================

      - name: Install dependencies
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " NPM INSTALL"
          echo "=========================================="

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi


      # ============================================================
      # CORE TESTS
      # ============================================================

      - name: Run SidePlay core tests
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " CORE TESTS"
          echo "=========================================="

          npm run test:core


      # ============================================================
      # WEB BUILD
      # ============================================================

      - name: Build SidePlay web app
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " WEB BUILD"
          echo "=========================================="

          npm run build


      # ============================================================
      # PREPARE ANDROID
      #
      # This command now handles:
      #
      # cap add android
      # cap sync android
      # patch-android.mjs
      # PlaybackService
      # MainActivity
      # Media3
      # NewPipe
      # yt-dlp
      # manifest
      # Gradle patches
      # playback/extractor processes
      # ============================================================

      - name: Prepare SidePlay Android
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " SIDEPLAY ANDROID PREP"
          echo "=========================================="

          npm run android:prepare

          echo ""
          echo "[OK] Android platform prepared."


      # ============================================================
      # VERIFY ANDROID
      # ============================================================

      - name: Verify generated Android project
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " VERIFY ANDROID"
          echo "=========================================="

          if [ ! -d android ]; then
            echo "::error::android/ missing."
            exit 1
          fi

          if [ ! -f android/gradlew ]; then
            echo "::error::android/gradlew missing."
            exit 1
          fi

          chmod +x android/gradlew

          PLAYBACK_SERVICE="$(
            find android/app/src/main \
              -type f \
              -name 'PlaybackService.java' \
              -print -quit
          )"

          if [ -z "$PLAYBACK_SERVICE" ]; then
            echo "::error::PlaybackService.java missing after android:prepare."
            exit 1
          fi

          echo "PlaybackService:"
          echo "$PLAYBACK_SERVICE"

          echo ""

          if ! grep -q "MediaSessionService" "$PLAYBACK_SERVICE"; then
            echo "::error::PlaybackService is missing MediaSessionService."
            exit 1
          fi

          echo "[OK] MediaSessionService"

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "::error::AndroidManifest.xml missing."
            exit 1
          fi

          if grep -q "PlaybackService" "$MANIFEST"; then
            echo "[OK] PlaybackService registered"
          else
            echo "::error::PlaybackService missing from manifest."
            exit 1
          fi

          echo ""
          echo "[OK] Native SidePlay engine present."


      # ============================================================
      # LOCAL.PROPERTIES
      # ============================================================

      - name: Configure Android SDK for Gradle
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          set -euo pipefail

          echo "sdk.dir=$ANDROID_HOME" > local.properties

          echo "local.properties:"
          cat local.properties


      # ============================================================
      # DIAGNOSTICS
      # ============================================================

      - name: Gradle diagnostics
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " JAVA"
          echo "=========================================="

          java -version

          echo ""
          echo "=========================================="
          echo " GRADLE"
          echo "=========================================="

          ./gradlew --version

          echo ""
          echo "=========================================="
          echo " ANDROID SDK"
          echo "=========================================="

          echo "$ANDROID_HOME"


      # ============================================================
      # BUILD APK
      # ============================================================

      - name: Build SidePlay APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " BUILD SIDEPLAY APK"
          echo "=========================================="

          ./gradlew \
            clean \
            assembleDebug \
            --stacktrace \
            --no-daemon


      # ============================================================
      # COLLECT APK
      # ============================================================

      - name: Collect SidePlay APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          APK="$(
            find android/app/build/outputs/apk \
              -type f \
              -name '*.apk' \
              -print -quit
          )"

          if [ -z "$APK" ]; then
            echo "::error::No APK produced."

            find android/app/build/outputs \
              -type f \
              2>/dev/null || true

            exit 1
          fi

          echo "APK generated:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/release"

          FINAL_APK="$GITHUB_WORKSPACE/release/SidePlay-v0.9.2-r10.2-BACKGROUND-SURVIVAL-FIXED.apk"

          cp "$APK" "$FINAL_APK"

          echo "FINAL_APK=$FINAL_APK" >> "$GITHUB_ENV"

          echo ""
          ls -lh "$FINAL_APK"


      # ============================================================
      # SUMMARY
      # ============================================================

      - name: Build summary
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "=========================================="
          echo " SIDEPLAY R10.2 BUILT"
          echo "=========================================="

          echo ""
          echo "Version:"
          echo "$EXPECTED_VERSION"

          echo ""
          echo "APK:"
          echo "$FINAL_APK"

          echo ""
          echo "Size:"
          du -h "$FINAL_APK"

          echo ""
          echo "SHA-256:"
          sha256sum "$FINAL_APK"


      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload SidePlay APK
        uses: actions/upload-artifact@v4
        with:
          name: SidePlay-v0.9.2-r10.2-BACKGROUND-SURVIVAL-FIXED
          path: release/SidePlay-v0.9.2-r10.2-BACKGROUND-SURVIVAL-FIXED.apk
          if-no-files-found: error
          retention-days: 30
