name: StickerForge v2.1 Animated — Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "StickerForge-v2.1-ANIMATED-source.zip"
      - ".github/workflows/build-stickerforge.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build StickerForge Animated APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ------------------------------------------------------------
      # 1. GET REPOSITORY
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. JAVA
      # ------------------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ------------------------------------------------------------
      # 3. ANDROID SDK
      # ------------------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ------------------------------------------------------------
      # 4. GRADLE
      # ------------------------------------------------------------
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # ------------------------------------------------------------
      # 5. FIND OUR ZIP
      # ------------------------------------------------------------
      - name: Find StickerForge source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository contents:"
          find . -maxdepth 3 -type f | sort

          ZIP="$(find . -maxdepth 4 -type f \
            \( \
              -iname 'StickerForge-v2.1-ANIMATED-source.zip' \
              -o -iname 'StickerForge*v2.1*ANIMATED*.zip' \
              -o -iname 'StickerForge*.zip' \
            \) \
            | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "::error::StickerForge source ZIP was not found."
            echo
            echo "ZIP files that DO exist:"
            find . -type f -iname '*.zip' -print || true
            exit 1
          fi

          echo "FOUND ZIP:"
          echo "$ZIP"

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # 6. EXTRACT
      # ------------------------------------------------------------
      - name: Extract StickerForge
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted

          unzip -q "${{ steps.source.outputs.zip }}" -d extracted

          echo "Extracted structure:"
          find extracted -maxdepth 5 -type f | sort | head -300

      # ------------------------------------------------------------
      # 7. LOCATE ANDROID PROJECT
      # ------------------------------------------------------------
      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS="$(find extracted -type f \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            | head -n 1)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::Could not find settings.gradle/settings.gradle.kts."
            echo
            find extracted -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # 8. SANITY CHECK
      # ------------------------------------------------------------
      - name: Verify project
        shell: bash
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          echo "=== PROJECT ROOT ==="
          pwd
          ls -la

          echo
          echo "=== GRADLE FILES ==="
          find . -maxdepth 3 \
            \( \
              -name '*.gradle' \
              -o -name '*.gradle.kts' \
              -o -name 'gradle.properties' \
              -o -name 'AndroidManifest.xml' \
            \) \
            -print

          echo
          echo "=== APP MODULE ==="

          if [ ! -d app ]; then
            echo "::error::app/ module is missing."
            exit 1
          fi

          if [ ! -f app/src/main/AndroidManifest.xml ]; then
            echo "::error::AndroidManifest.xml is missing."
            exit 1
          fi

          echo "StickerForge Android project looks valid."

      # ------------------------------------------------------------
      # 9. MAKE GRADLE WRAPPER AVAILABLE
      # ------------------------------------------------------------
      - name: Prepare Gradle
        shell: bash
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          # Generate wrapper if the source ZIP doesn't contain one.
          if [ ! -f gradlew ]; then
            echo "No Gradle wrapper found. Generating Gradle 8.9 wrapper..."
            gradle wrapper --gradle-version 8.9
          fi

          chmod +x gradlew

          echo
          ./gradlew --version

      # ------------------------------------------------------------
      # 10. CHECK DEPENDENCIES
      # ------------------------------------------------------------
      - name: Resolve Android dependencies
        shell: bash
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          ./gradlew dependencies \
            --no-daemon \
            --stacktrace

      # ------------------------------------------------------------
      # 11. CLEAN
      # ------------------------------------------------------------
      - name: Clean
        shell: bash
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          ./gradlew clean \
            --no-daemon \
            --stacktrace

      # ------------------------------------------------------------
      # 12. BUILD
      # ------------------------------------------------------------
      - name: Build debug APK
        shell: bash
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # ------------------------------------------------------------
      # 13. FIND APK
      # ------------------------------------------------------------
      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.project_dir }}"

          echo "Looking for APK..."

          find "$PROJECT" -type f -name '*.apk' -print

          APK="$(find "$PROJECT/app/build/outputs/apk" \
            -type f \
            -name '*.apk' \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "::error::Gradle completed but no APK was found."
            exit 1
          fi

          mkdir -p stickerforge-output

          cp "$APK" \
            stickerforge-output/StickerForge-v2.1-Animated-debug.apk

          echo "apk=stickerforge-output/StickerForge-v2.1-Animated-debug.apk" \
            >> "$GITHUB_OUTPUT"

          echo
          echo "APK READY:"
          ls -lh stickerforge-output/

      # ------------------------------------------------------------
      # 14. UPLOAD APK
      # ------------------------------------------------------------
      - name: Upload StickerForge APK
        uses: actions/upload-artifact@v4
        with:
          name: StickerForge-v2.1-Animated-APK
          path: stickerforge-output/StickerForge-v2.1-Animated-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ------------------------------------------------------------
      # 15. DIAGNOSTICS IF WE MANAGE TO BREAK SOMETHING AGAIN 💀
      # ------------------------------------------------------------
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: StickerForge-build-diagnostics
          path: |
            extracted/**/build/reports/**
            extracted/**/build/outputs/logs/**
            extracted/**/.gradle/**
          if-no-files-found: ignore
          retention-days: 7
