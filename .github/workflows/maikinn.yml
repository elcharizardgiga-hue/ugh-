name: SIDEPLAY 0.8.4 R9 HOTFIX2 — PLAYBACK RESURRECTION ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: BUILD SIDEPLAY 0.8.4 R9 HOTFIX2
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. LOCATE SIDEPLAY SOURCE
      #
      # Supports:
      #
      # repo/package.json
      #
      # repo/SomeFolder/package.json
      #
      # repo/SidePlay-Whatever.zip
      #
      # It explicitly prefers:
      # SidePlay-Node-v0.8.4-R9-HOTFIX2-PLAYBACK-RESURRECTION.zip
      # ============================================================

      - name: Locate SidePlay source
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import shutil
          import zipfile
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          runner_temp = Path(os.environ["RUNNER_TEMP"]).resolve()
          github_env = Path(os.environ["GITHUB_ENV"])

          print("=" * 64)
          print(" Looking for SidePlay source")
          print("=" * 64)
          print("Workspace:", workspace)
          print()

          src = None

          # --------------------------------------------------------
          # CASE 1:
          # package.json directly at repo root
          # --------------------------------------------------------

          root_package = workspace / "package.json"

          if root_package.is_file():
              src = workspace
              print("✅ package.json found at repository root")

          # --------------------------------------------------------
          # CASE 2:
          # source inside a folder
          # --------------------------------------------------------

          if src is None:
              packages = []

              for p in workspace.rglob("package.json"):
                  if not p.is_file():
                      continue

                  if ".git" in p.parts:
                      continue

                  if "node_modules" in p.parts:
                      continue

                  # Ignore generated Android package files
                  if "android" in p.parts:
                      continue

                  packages.append(p)

              if packages:
                  packages.sort(key=lambda p: (len(p.parts), str(p)))
                  src = packages[0].parent

                  print("✅ Found SidePlay source folder:")
                  print(src)

          # --------------------------------------------------------
          # CASE 3:
          # SidePlay ZIP stored in repository
          # --------------------------------------------------------

          if src is None:
              preferred_name = (
                  "SidePlay-Node-v0.8.4-"
                  "R9-HOTFIX2-PLAYBACK-RESURRECTION.zip"
              )

              preferred = workspace / preferred_name

              zip_path = None

              if preferred.is_file():
                  zip_path = preferred

                  print("✅ Found exact R9 Hotfix2 ZIP:")
                  print(zip_path)

              else:
                  zips = []

                  for p in workspace.rglob("*.zip"):
                      if not p.is_file():
                          continue

                      if ".git" in p.parts:
                          continue

                      if "sideplay" not in p.name.lower():
                          continue

                      zips.append(p)

                  # Strongly prefer R9 + HOTFIX2
                  preferred_candidates = [
                      p
                      for p in zips
                      if "r9" in p.name.lower()
                      and "hotfix2" in p.name.lower()
                  ]

                  if preferred_candidates:
                      preferred_candidates.sort()
                      zip_path = preferred_candidates[0]

                  elif zips:
                      # Last fallback: newest SidePlay-looking ZIP
                      zips.sort(
                          key=lambda p: p.stat().st_mtime,
                          reverse=True
                      )
                      zip_path = zips[0]

                  if zip_path:
                      print("📦 Found SidePlay ZIP:")
                      print(zip_path)

              if zip_path:
                  extract_dir = runner_temp / "sideplay-source"

                  if extract_dir.exists():
                      shutil.rmtree(extract_dir)

                  extract_dir.mkdir(parents=True)

                  print()
                  print("Extracting ZIP...")

                  with zipfile.ZipFile(zip_path, "r") as z:
                      z.extractall(extract_dir)

                  packages = []

                  for p in extract_dir.rglob("package.json"):
                      if not p.is_file():
                          continue

                      if "node_modules" in p.parts:
                          continue

                      packages.append(p)

                  if packages:
                      packages.sort(
                          key=lambda p: (len(p.parts), str(p))
                      )

                      src = packages[0].parent

                      print()
                      print("✅ Extracted SidePlay source:")
                      print(src)

          # --------------------------------------------------------
          # FAILURE DIAGNOSTICS
          # --------------------------------------------------------

          if src is None:
              print()
              print("❌ SIDEPLAY SOURCE NOT FOUND")
              print()
              print("Repository contents:")
              print()

              shown = 0

              for p in sorted(workspace.rglob("*")):
                  if not p.is_file():
                      continue

                  if ".git" in p.parts:
                      continue

                  try:
                      print(p.relative_to(workspace))
                  except Exception:
                      print(p)

                  shown += 1

                  if shown >= 300:
                      break

              raise SystemExit(1)

          # --------------------------------------------------------
          # BASIC SANITY
          # --------------------------------------------------------

          package_json = src / "package.json"

          if not package_json.is_file():
              raise SystemExit(
                  f"Located source has no package.json: {src}"
              )

          # Export SIDEPLAY_DIR for all later steps
          with github_env.open(
              "a",
              encoding="utf-8"
          ) as f:
              f.write(f"SIDEPLAY_DIR={src}\n")

          print()
          print("=" * 64)
          print(" SIDEPLAY SOURCE READY")
          print("=" * 64)

          print("SIDEPLAY_DIR =", src)
          print("package.json =", package_json)

          print()
          print("Top-level source contents:")

          for child in sorted(src.iterdir()):
              print(" -", child.name)

          PY

      # ============================================================
      # 3. VERIFY SOURCE
      # ============================================================

      - name: Verify exact R9 Hotfix2 source
        shell: bash
        run: |
          set -euo pipefail

          cd "$SIDEPLAY_DIR"

          echo "Current source:"
          pwd

          echo
          echo "Checking package version..."

          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("package.json")

          if not p.exists():
              raise SystemExit(
                  "package.json missing after source discovery"
              )

          package = json.loads(
              p.read_text(encoding="utf-8")
          )

          version = package.get("version")

          print("SOURCE_VERSION =", version)

          if version != "0.8.4-r9":
              raise SystemExit(
                  f"Expected 0.8.4-r9, got {version!r}"
              )
          PY

          echo
          echo "Checking required source files..."

          test -f src/App.tsx
          test -f scripts/patch-android.mjs

          test -f native/android/PlaybackService.java
          test -f native/android/BackgroundAudioPlugin.java
          test -f native/android/NativeYouTubePlugin.java
          test -f native/android/YtDlpPlugin.java
          test -f native/android/YtDlpExtractorService.java
          test -f native/android/YtDlpIsolatedClient.java
          test -f native/android/NewPipeYouTubeResolver.java
          test -f native/android/SidePlayNewPipeDownloader.java

          test -f src/lib/trackIdentity.ts
          test -f src/lib/tasteEngine.ts
          test -f src/lib/musicIdentity.ts
          test -f src/lib/lyrics.ts
          test -f src/lib/universalSource.ts

          echo
          echo "Checking R9 intelligence..."

          grep -q 'repairTrackIdentity' \
            src/App.tsx

          grep -q 'buildTasteProfile' \
            src/lib/tasteEngine.ts

          grep -q 'rankAndDedupeMusicSearch' \
            src/lib/musicIdentity.ts

          grep -q 'NativeYouTube.lyrics' \
            src/lib/lyrics.ts

          grep -q 'recordSkip' \
            src/lib/store.tsx

          grep -q "queueOrigin: 'autoplay'" \
            src/App.tsx

          echo
          echo "Checking native search / lyrics..."

          grep -q 'public void suggest(PluginCall call)' \
            native/android/NativeYouTubePlugin.java

          grep -q 'public void lyrics(PluginCall call)' \
            native/android/NativeYouTubePlugin.java

          echo
          echo "Checking resolver fortress..."

          grep -q 'FFMPEG_INIT_LOCK' \
            native/android/YtDlpPlugin.java

          grep -q 'EXTRACTOR_LOCK' \
            native/android/YtDlpPlugin.java

          grep -q 'YtDlpIsolatedClient.resolve' \
            native/android/YtDlpPlugin.java

          grep -q 'requireIsolatedExtractorProcess' \
            native/android/YtDlpPlugin.java

          grep -q 'resolveBlocking' \
            native/android/YtDlpIsolatedClient.java

          grep -q 'newpipe-dash-adaptive' \
            native/android/NewPipeYouTubeResolver.java

          if grep -q 'javax.annotation' \
            native/android/SidePlayNewPipeDownloader.java
          then
            echo "❌ javax.annotation regression detected"
            exit 1
          fi

          echo
          echo "Checking Hotfix2 Playback Resurrection..."

          grep -q 'START_STICKY' \
            native/android/PlaybackService.java

          grep -q 'hasRecentPlayingSnapshot' \
            native/android/PlaybackService.java

          grep -q 'recoverSnapshot' \
            native/android/PlaybackService.java

          grep -q 'process-resurrection' \
            native/android/PlaybackService.java

          grep -q 'restored-refreshed' \
            native/android/PlaybackService.java

          grep -q 'waiting-network' \
            native/android/PlaybackService.java

          grep -q 'RECOVERY_HEARTBEAT_MS' \
            native/android/PlaybackService.java

          echo
          echo "Checking process diagnostics..."

          grep -q 'heartbeatAt' \
            native/android/BackgroundAudioPlugin.java

          grep -q 'LOW_MEMORY' \
            native/android/BackgroundAudioPlugin.java

          grep -q 'PACKAGE_UPDATED' \
            native/android/BackgroundAudioPlugin.java

          echo
          echo "Checking InnerTube circuit breaker..."

          grep -q 'innerTubeCooldownUntilMs' \
            native/android/NativeYouTubePlugin.java

          grep -q 'innerTubeFailureStreak' \
            native/android/NativeYouTubePlugin.java

          echo
          echo "✅ R9 Hotfix2 source verified"

      # ============================================================
      # 4. NODE
      # ============================================================

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # ============================================================
      # 5. JAVA
      # ============================================================

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ============================================================
      # 6. ANDROID SDK
      # ============================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo
          echo "Android SDK:"
          echo "$ANDROID_SDK_ROOT"

      # ============================================================
      # 7. NPM INSTALL
      # ============================================================

      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$SIDEPLAY_DIR"

          echo "Node version:"
          node --version

          echo
          echo "npm version:"
          npm --version

          echo
          echo "TypeScript requested by package.json:"

          node - <<'NODE'
          const p = require("./package.json");

          console.log(
            p.devDependencies?.typescript ??
            p.dependencies?.typescript ??
            "not explicitly pinned"
          );
          NODE

          echo
          echo "Installing dependencies..."

          npm install \
            --no-audit \
            --no-fund

      # ============================================================
      # 8. TESTS
      # ============================================================

      - name: Run SidePlay regression tests
        shell: bash
        run: |
          set -euo pipefail

          cd "$SIDEPLAY_DIR"

          if npm run | grep -q 'test:core'; then
            npm run test:core
          else
            echo "⚠️ No test:core script found."
            echo "Continuing to TypeScript/web build."
          fi

      # ============================================================
      # 9. WEB BUILD
      # ============================================================

      - name: Build SidePlay web app
        shell: bash
        run: |
          set -euo pipefail

          cd "$SIDEPLAY_DIR"

          npm run build

      # ============================================================
      # 10. FRESH CAPACITOR ANDROID PROJECT
      # ============================================================

      - name: Generate fresh Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$SIDEPLAY_DIR"

          echo "Removing stale Android project..."
          rm -rf android

          echo
          echo "Creating fresh Capacitor Android project..."
          npx cap add android

          echo
          echo "Syncing Capacitor..."
          npx cap sync android

          echo
          echo "Applying SidePlay native patches..."
          node scripts/patch-android.mjs

      # ============================================================
      # 11. VERIFY PATCHED NATIVE PROJECT
      # ============================================================

      - name: Verify patched Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$SIDEPLAY_DIR"

          JAVA="android/app/src/main/java/app/sideplay/mobile"
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          echo "Checking generated native files..."

          test -f "$JAVA/PlaybackService.java"
          test -f "$JAVA/BackgroundAudioPlugin.java"
          test -f "$JAVA/NativeYouTubePlugin.java"
          test -f "$JAVA/YtDlpPlugin.java"
          test -f "$JAVA/YtDlpExtractorService.java"
          test -f "$JAVA/YtDlpIsolatedClient.java"
          test -f "$JAVA/NewPipeYouTubeResolver.java"
          test -f "$JAVA/SidePlayNewPipeDownloader.java"

          echo
          echo "Checking Resurrection survived patching..."

          grep -q 'START_STICKY' \
            "$JAVA/PlaybackService.java"

          grep -q 'hasRecentPlayingSnapshot' \
            "$JAVA/PlaybackService.java"

          grep -q 'recoverSnapshot' \
            "$JAVA/PlaybackService.java"

          grep -q 'process-resurrection' \
            "$JAVA/PlaybackService.java"

          grep -q 'RECOVERY_HEARTBEAT_MS' \
            "$JAVA/PlaybackService.java"

          echo
          echo "Checking diagnostics..."

          grep -q 'LOW_MEMORY' \
            "$JAVA/BackgroundAudioPlugin.java"

          grep -q 'PACKAGE_UPDATED' \
            "$JAVA/BackgroundAudioPlugin.java"

          echo
          echo "Checking InnerTube cooldown..."

          grep -q 'innerTubeCooldownUntilMs' \
            "$JAVA/NativeYouTubePlugin.java"

          echo
          echo "Checking isolated Android processes..."

          grep -q \
            'android:name=".YtDlpExtractorService"' \
            "$MANIFEST"

          grep -q \
            'android:process=":extractor"' \
            "$MANIFEST"

          grep -q \
            'android:process=":playback"' \
            "$MANIFEST"

          if grep -q 'javax.annotation' \
            "$JAVA/SidePlayNewPipeDownloader.java"
          then
            echo "❌ javax.annotation regression detected"
            exit 1
          fi

          echo
          echo "✅ Patched native project verified"

      # ============================================================
      # 12. FORCE RELEASE IDENTITY
      #
      # versionCode 816
      # versionName 0.8.4-r9
      # ARM64 only
      # ============================================================

      - name: Force Android release identity
        shell: bash
        run: |
          set -euo pipefail

          cd "$SIDEPLAY_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")

          if not p.exists():
              raise SystemExit(
                  "android/app/build.gradle missing"
              )

          s = p.read_text(
              encoding="utf-8"
          )

          s, version_code_matches = re.subn(
              r'(?m)^(\s*)versionCode\s+\d+\s*$',
              r'\1versionCode 816',
              s,
              count=1
          )

          s, version_name_matches = re.subn(
              r'(?m)^(\s*)versionName\s+["\'][^"\']+["\']\s*$',
              r'\1versionName "0.8.4-r9"',
              s,
              count=1
          )

          if version_code_matches != 1:
              raise SystemExit(
                  "Could not patch versionCode. "
                  f"Matches={version_code_matches}"
              )

          if version_name_matches != 1:
              raise SystemExit(
                  "Could not patch versionName. "
                  f"Matches={version_name_matches}"
              )

          arm64_line = (
              'ndk { abiFilters "arm64-v8a" }'
          )

          if arm64_line not in s:
              marker = "defaultConfig {"

              if marker not in s:
                  
