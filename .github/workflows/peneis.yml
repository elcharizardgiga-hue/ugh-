name: SIDEPLAY 0.8.2 — FAST / STABLE / HEADLESS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-sideplay-v0.8.2-AUTORUN.yml'

permissions:
  contents: read

jobs:
  build:
    name: BUILD EXACT v0.8.2 ARM64
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Require exact v0.8.1 base source
        shell: bash
        run: |
          set -euo pipefail
          ZIP='SidePlay-Node-v0.8.1-STAY-INSIDE-BACKGROUND.zip'
          EXPECTED='9d7f0b8f14a5f26f543862fda18d0296395174f7e9c4c1b3bfbac4c139c11242'
          test -f "$ZIP" || { echo "ERROR: $ZIP missing"; exit 1; }
          ACTUAL="$(sha256sum "$ZIP" | awk '{print $1}')"
          echo "SOURCE ZIP SHA256=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED" || { echo 'ERROR: wrong v0.8.1 base ZIP'; exit 1; }
          rm -rf sideplay release signing
          mkdir sideplay
          unzip -q "$ZIP" -d sideplay
          test "$(node -p \"require('./sideplay/package.json').version\")" = '0.8.1'
          rm -rf sideplay/android

      - name: Patch source to v0.8.2 fast/stable
        working-directory: sideplay
        shell: bash
        env:
          PATCH_B64: ''
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 --decode > /tmp/patch-sideplay-v082.py
          python3 /tmp/patch-sideplay-v082.py
          test "$(node -p \"require('./package.json').version\")" = '0.8.2'
          grep -q 'SidePlay/0.8.2 Android' native/android/PlaybackService.java
          grep -q 'FFMPEG_INIT_LOCK' native/android/YtDlpPlugin.java
          grep -q 'SidePlayYtDlpUpdater' native/android/YtDlpPlugin.java
          grep -q -- '--socket-timeout' native/android/YtDlpPlugin.java
          ! grep -q "scope === 'all' || scope === 'soundcloud'" src/App.tsx
          echo '✅ v0.8.2 fast/stable patch applied'

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install and build web app
        working-directory: sideplay
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build

      - name: Generate fresh Android project and apply native patches
        working-directory: sideplay
        shell: bash
        run: |
          set -euo pipefail
          test ! -d android
          npx cap add android
          npx cap sync android
          node scripts/patch-android.mjs
          grep -q 'SidePlay/0.8.2 Android' android/app/src/main/java/app/sideplay/mobile/PlaybackService.java
          grep -q 'FFMPEG_INIT_LOCK' android/app/src/main/java/app/sideplay/mobile/YtDlpPlugin.java

      - name: Force Android 0.8.2 / 802 and ARM64 only
        working-directory: sideplay
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/build.gradle')
          s = p.read_text()
          s, n1 = re.subn(r'(?m)^(\s*)versionCode\s+\d+\s*$', r'\1versionCode 802', s, count=1)
          s, n2 = re.subn(r'(?m)^(\s*)versionName\s+["\'][^"\']+["\']\s*$', r'\1versionName "0.8.2"', s, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f'version metadata patch failed: code={n1}, name={n2}')
          marker = 'defaultConfig {'
          if marker not in s:
              raise SystemExit('defaultConfig missing')
          if 'abiFilters "arm64-v8a"' not in s:
              s = s.replace(marker, marker + '\n        ndk { abiFilters "arm64-v8a" }', 1)
          p.write_text(s)
          PY
          grep -n 'versionCode 802' android/app/build.gradle
          grep -n 'versionName "0.8.2"' android/app/build.gradle
          grep -n 'abiFilters "arm64-v8a"' android/app/build.gradle

      - name: Compile release APK
        working-directory: sideplay/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:clean :app:assembleRelease --stacktrace --no-daemon

      - name: Sign and hard-verify APK
        shell: bash
        env:
          SIDEPLAY_KEYSTORE_B64: ${{ secrets.SIDEPLAY_KEYSTORE_B64 }}
          SIDEPLAY_KEYSTORE_PASSWORD: ${{ secrets.SIDEPLAY_KEYSTORE_PASSWORD }}
          SIDEPLAY_KEY_ALIAS: ${{ secrets.SIDEPLAY_KEY_ALIAS }}
          SIDEPLAY_KEY_PASSWORD: ${{ secrets.SIDEPLAY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p signing release
          APK="$(find sideplay/android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*-release-unsigned.apk' | head -n1)"
          test -f "$APK"

          if [ -n "${SIDEPLAY_KEYSTORE_B64:-}" ] && [ -n "${SIDEPLAY_KEYSTORE_PASSWORD:-}" ] && [ -n "${SIDEPLAY_KEY_ALIAS:-}" ] && [ -n "${SIDEPLAY_KEY_PASSWORD:-}" ]; then
            printf '%s' "$SIDEPLAY_KEYSTORE_B64" | base64 --decode > signing/sideplay.jks
            KS="$SIDEPLAY_KEYSTORE_PASSWORD"; ALIAS="$SIDEPLAY_KEY_ALIAS"; KP="$SIDEPLAY_KEY_PASSWORD"
          else
            keytool -genkeypair -v -keystore signing/sideplay.jks -storepass sideplay123 -keypass sideplay123 -alias sideplay -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=SidePlay CI, O=SidePlay, C=DO'
            KS=sideplay123; ALIAS=sideplay; KP=sideplay123
          fi

          ZA="$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign"
          AS="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2"
          "$ZA" -f -p 4 "$APK" signing/aligned.apk
          OUT="release/SIDEPLAY_0.8.2_FAST_STABLE_ARM64_RUN_${GITHUB_RUN_NUMBER}.apk"
          "$AS" sign --ks signing/sideplay.jks --ks-key-alias "$ALIAS" --ks-pass "pass:$KS" --key-pass "pass:$KP" --out "$OUT" signing/aligned.apk
          "$AS" verify --verbose --print-certs "$OUT"
          "$ZA" -c -v 4 "$OUT"
          "$AAPT" dump badging "$OUT" | tee release/APK_BADGING.txt
          grep -q "package: name='app.sideplay.mobile'" release/APK_BADGING.txt
          grep -q "versionCode='802'" release/APK_BADGING.txt
          grep -q "versionName='0.8.2'" release/APK_BADGING.txt

          unzip -l "$OUT" | tee release/APK_CONTENTS.txt
          grep -q 'lib/arm64-v8a/libpython' release/APK_CONTENTS.txt
          ! grep -q 'lib/x86/' rele
