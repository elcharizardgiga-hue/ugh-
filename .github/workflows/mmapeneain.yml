name: SidePlay R9 HF2 Direct ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build SidePlay R9 HF2
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prove correct workflow
        shell: bash
        run: |
          set -euo pipefail
          echo "SIDEPLAY R9 HF2 DIRECT WORKFLOW V5"
          echo "RUN=$GITHUB_RUN_NUMBER"
          echo "SHA=$GITHUB_SHA"
          echo "WORKSPACE=$GITHUB_WORKSPACE"

      - name: Extract exact SidePlay Hotfix2 ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/SidePlay-Node-v0.8.4-R9-HOTFIX2-PLAYBACK-RESURRECTION.zip"
          DEST="$RUNNER_TEMP/sideplay-hf2"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: exact Hotfix2 ZIP not found:"
            echo "$ZIP"
            echo
            ls -la "$GITHUB_WORKSPACE"
            exit 1
          fi

          rm -rf "$DEST"
          mkdir -p "$DEST"

          python3 - "$ZIP" "$DEST" <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          src = Path(sys.argv[1])
          dst = Path(sys.argv[2])

          with zipfile.ZipFile(src, "r") as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"Corrupt ZIP member: {bad}")
              z.extractall(dst)

          print(f"Extracted {src.name} to {dst}")
          PY

          PACKAGE="$(
            python3 - "$DEST" <<'PY'
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          candidates = [
              p for p in root.rglob("package.json")
              if p.is_file() and "node_modules" not in p.parts
          ]

          if not candidates:
              raise SystemExit("No package.json found inside ZIP")

          candidates.sort(key=lambda p: (len(p.parts), str(p)))
          print(candidates[0])
          PY
          )"

          SIDEPLAY_DIR="$(dirname "$PACKAGE")"

          echo "SIDEPLAY_DIR=$SIDEPLAY_DIR" >> "$GITHUB_ENV"
          echo "SIDEPLAY_DIR=$SIDEPLAY_DIR"
          ls -la "$SIDEPLAY_DIR"

      - name: Verify R9 Hotfix2 source
        shell: bash
        run: |
          set -euo pipefail
          cd "$SIDEPLAY_DIR"

          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("package.json")
          data = json.loads(p.read_text(encoding="utf-8"))

          version = data.get("version")
          print("SidePlay version:", version)

          if version != "0.8.4-r9":
              raise SystemExit(f"Expected 0.8.4-r9, got {version!r}")

          ts = (
              data.get("devDependencies", {}).get("typescript")
              or data.get("dependencies", {}).get("typescript")
          )
          print("TypeScript:", ts)

          if ts and "5.8.0" in ts:
              raise SystemExit("Broken TypeScript 5.8.0 pin detected")
          PY

          test -f src/App.tsx
          test -f scripts/patch-android.mjs

          test -f native/android/PlaybackService.java
          test -f native/android/BackgroundAudioPlugin.java
          test -f native/android/NativeYouTubePlugin.java
          test -f native/android/YtDlpPlugin.java
          test -f native/android/YtDlpExtractorService.java
          test -f native/android/YtDlpIsolatedClient.java

          grep -q 'START_STICKY' native/android/PlaybackService.java
          grep -q 'recoverSnapshot' native/android/PlaybackService.java
          grep -q 'process-resurrection' native/android/PlaybackService.java
          grep -q 'LOW_MEMORY' native/android/BackgroundAudioPlugin.java
          grep -q 'PACKAGE_UPDATED' native/android/BackgroundAudioPlugin.java
          grep -q 'innerTubeCooldownUntilMs' native/android/NativeYouTubePlugin.java

          echo "R9 Hotfix2 source verified"

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$SIDEPLAY_DIR"

          node --version
          npm --version

          npm install --no-audit --no-fund

      - name: Run core tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$SIDEPLAY_DIR"

          if npm run | grep -q 'test:core'; then
            npm run test:core
          else
            echo "No test:core script; continuing."
          fi

      - name: Build web app
        shell: bash
        run: |
          set -euo pipefail
          cd "$SIDEPLAY_DIR"
          npm run build

      - name: Generate clean Android project
        shell: bash
        run: |
          set -euo pipefail
          cd "$SIDEPLAY_DIR"

          rm -rf android
          npx cap add android
          npx cap sync android
          node scripts/patch-android.mjs

      - name: Verify generated native sources
        shell: bash
        run: |
          set -euo pipefail
          cd "$SIDEPLAY_DIR"

          JAVA="android/app/src/main/java/app/sideplay/mobile"
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          test -f "$JAVA/PlaybackService.java"
          test -f "$JAVA/BackgroundAudioPlugin.java"
          test -f "$JAVA/NativeYouTubePlugin.java"

          grep -q 'START_STICKY' "$JAVA/PlaybackService.java"
          grep -q 'recoverSnapshot' "$JAVA/PlaybackService.java"
          grep -q 'process-resurrection' "$JAVA/PlaybackService.java"
          grep -q 'LOW_MEMORY' "$JAVA/BackgroundAudioPlugin.java"
          grep -q 'innerTubeCooldownUntilMs' "$JAVA/NativeYouTubePlugin.java"

          grep -q 'android:process=":playback"' "$MANIFEST"
          grep -q 'android:process=":extractor"' "$MANIFEST"

          echo "Generated native source verified"

      - name: Force version and ARM64
        shell: bash
        run: |
          set -euo pipefail
          cd "$SIDEPLAY_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          s = p.read_text(encoding="utf-8")

          s, n1 = re.subn(
              r'(?m)^(\s*)versionCode\s+\d+\s*$',
              r'\1versionCode 816',
              s,
              count=1,
          )

          s, n2 = re.subn(
              r'(?m)^(\s*)versionName\s+["\'][^"\']+["\']\s*$',
              r'\1versionName "0.8.4-r9"',
              s,
              count=1,
          )

          if n1 != 1 or n2 != 1:
              raise SystemExit(
                  f"Version patch failed: versionCode={n1}, versionName={n2}"
              )

          arm64 = 'ndk { abiFilters "arm64-v8a" }'

          if arm64 not in s:
              marker = "defaultConfig {"
              if marker not in s:
                  raise SystemExit("defaultConfig block missing")
              s = s.replace(
                  marker,
                  marker + "\n        " + arm64,
                  1,
              )

          p.write_text(s, encoding="utf-8")
          PY

          grep -q 'versionCode 816' android/app/build.gradle
          grep -q 'versionName "0.8.4-r9"' android/app/build.gradle
          grep -q 'abiFilters "arm64-v8a"' android/app/build.gradle

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$SIDEPLAY_DIR/android"

          chmod +x gradlew
          ./gradlew \
            :app:clean \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Locate unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$SIDEPLAY_DIR"

          APK="$(
            python3 - <<'PY'
          from pathlib import Path

          root = Path("android/app/build/outputs/apk/release")
          candidates = sorted(root.glob("*-release-unsigned.apk"))

          if not candidates:
              raise SystemExit("Unsigned release APK not found")

          print(candidates[0].resolve())
          PY
          )"

          echo "UNSIGNED_APK=$APK" >> "$GITHUB_ENV"
          echo "UNSIGNED_APK=$APK"

      - name: Sign and verify APK
        shell: bash
        env:
          SIDEPLAY_KEYSTORE_B64: ${{ secrets.SIDEPLAY_KEYSTORE_B64 }}
          SIDEPLAY_KEYSTORE_PASSWORD: ${{ secrets.SIDEPLAY_KEYSTORE_PASSWORD }}
          SIDEPLAY_KEY_ALIAS: ${{ secrets.SIDEPLAY_KEY_ALIAS }}
          SIDEPLAY_KEY_PASSWORD: ${{ secrets.SIDEPLAY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd "$SIDEPLAY_DIR"

          mkdir -p signing release

          if \
            [ -n "${SIDEPLAY_KEYSTORE_B64:-}" ] && \
            [ -n "${SIDEPLAY_KEYSTORE_PASSWORD:-}" ] && \
            [ -n "${SIDEPLAY_KEY_ALIAS:-}" ] && \
            [ -n "${SIDEPLAY_KEY_PASSWORD:-}" ]
          then
            echo "Using persistent signing key"

            printf '%s' "$SIDEPLAY_KEYSTORE_B64" \
              | base64 --decode \
              > signing/sideplay.jks

            KS="$SIDEPLAY_KEYSTORE_PASSWORD"
            ALIAS="$SIDEPLAY_KEY_ALIAS"
            KP="$SIDEPLAY_KEY_PASSWORD"
          else
            echo "Using temporary CI signing key"

            keytool \
              -genkeypair \
              -keystore signing/sideplay.jks \
              -storepass sideplay123 \
              -keypass sideplay123 \
              -alias sideplay \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=SidePlay CI,O=SidePlay,C=DO"

            KS="sideplay123"
            ALIAS="sideplay"
            KP="sideplay123"
          fi

          TOOLS="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          ZIPALIGN="$TOOLS/zipalign"
          APKSIGNER="$TOOLS/apksigner"
          AAPT="$TOOLS/aapt"

          "$ZIPALIGN" \
            -f \
            -p \
            4 \
            "$UNSIGNED_APK" \
            signing/sideplay-aligned.apk

          OUT="release/SidePlay-0.8.4-r9-HF2-arm64.apk"

          "$APKSIGNER" sign \
            --ks signing/sideplay.jks \
            --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$KS" \
            --key-pass "pass:$KP" \
            --out "$OUT" \
            signing/sideplay-aligned.apk

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$OUT"

          "$ZIPALIGN" \
            -c \
            -v \
            4 \
            "$OUT"

          "$AAPT" dump badging "$OUT" \
            | tee release/APK_BADGING.txt

          grep -q "package: name='app.sideplay.mobile'" \
            release/APK_BADGING.txt

          grep -q "versionCode='816'" \
            release/APK_BADGING.txt

          grep -q "versionName='0.8.4-r9'" \
            release/APK_BADGING.txt

          unzip -l "$OUT" \
            | tee release/APK_CONTENTS.txt

          grep -q 'lib/arm64-v8a/' \
            release/APK_CONTENTS.txt

          sha256sum "$OUT" \
            | tee release/SHA256.txt

          REAL_APK="$(realpath "$OUT")"
          echo "APK_PATH=$REAL_APK" >> "$GITHUB_ENV"

          echo "APK ready:"
          echo "$REAL_APK"

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: SIDEPLAY-R9-HF2-ARM64-${{ github.run_number }}
          path: |
            ${{ env.APK_PATH }}
            ${{ env.SIDEPLAY_DIR }}/release/APK_BADGING.txt
            ${{ env.SIDEPLAY_DIR }}/release/APK_CONTENTS.txt
            ${{ env.SIDEPLAY_DIR }}/release/SHA256.txt
          if-no-files-found: error
          retention-days: 14
          
