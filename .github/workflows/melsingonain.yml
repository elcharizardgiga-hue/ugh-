

            name: "🟢 SIDEPLAY R9 HF2 — DIRECT ZIP ARM64"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: "HF2 DIRECT BUILD — USE THIS ONE"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v7

      # ============================================================
      # 2. PROVE THIS IS THE CORRECT WORKFLOW
      # ============================================================

      - name: Prove correct workflow
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================================"
          echo "🔥 SIDEPLAY R9 HF2 DIRECT ZIP WORKFLOW V4 🔥"
          echo "======================================================"
          echo "RUN=$GITHUB_RUN_NUMBER"
          echo "SHA=$GITHUB_SHA"
          echo "WORKSPACE=$GITHUB_WORKSPACE"
          echo

      # ============================================================
      # 3. EXTRACT EXACT HOTFIX2 ZIP
      #
      # No GNU find.
      # No fuzzy detection.
      # Uses the exact ZIP already present in your repo.
      # ============================================================

      - name: Extract exact SidePlay Hotfix2 ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/SidePlay-Node-v0.8.4-R9-HOTFIX2-PLAYBACK-RESURRECTION.zip"
          DEST="$RUNNER_TEMP/sideplay-hf2"

          echo "Expected ZIP:"
          echo "$ZIP"
          echo

          if [ ! -f "$ZIP" ]; then
            echo "❌ EXACT HOTFIX2 ZIP NOT FOUND"
            echo
            echo "Repository root:"
            ls -la "$GITHUB_WORKSPACE"
            exit 1
          fi

          rm -rf "$DEST"
          mkdir -p "$DEST"

          python3 - "$ZIP" "$DEST" <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          source = Path(sys.argv[1])
          destination = Path(sys.argv[2])

          print("Opening ZIP:", source)

          with zipfile.ZipFile(source, "r") as z:
              broken = z.testzip()

              if broken:
                  raise SystemExit(
                      f"Corrupt ZIP member detected: {broken}"
                  )

              print("ZIP entries:", len(z.infolist()))
              z.extractall(destination)

          print("Extraction complete:", destination)
          PY

          PACKAGE="$(
            python3 - "$DEST" <<'PY'
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])

          candidates = []

          for p in root.rglob("package.json"):
              if "node_modules" in p.parts:
                  continue

              if not p.is_file():
                  continue

              candidates.append(p)

          if not candidates:
              raise SystemExit(
                  "No package.json found inside SidePlay ZIP"
              )

          candidates.sort(
              key=lambda p: (len(p.parts), str(p))
          )

          print(candidates[0])
          PY
          )"

          if [ -z "$PACKAGE" ]; then
            echo "❌ package.json not found inside ZIP"
            exit 1
          fi

          SIDEPLAY_DIR="$(dirname "$PACKAGE")"

          echo "SIDEPLAY_DIR=$SIDEPLAY_DIR" >> "$GITHUB_ENV"

          echo
          echo "======================================================"
          echo "✅ SIDEPLAY SOURCE EXTRACTED"
          echo "======================================================"
          echo "SIDEPLAY_DIR=$SIDEPLAY_DIR"
          echo
          echo "Source root:"
          ls -la "$SIDEPLAY_DIR"

      # ============================================================
      # 4. VERIFY HOTFIX2 SOURCE
      # ============================================================

      - name: Verify R9 Hotfix2 source
        shell: bash
        run: |
          set -euo pipefail

          cd "$SIDEPLAY_DIR"

          echo "Working directory:"
          pwd
          echo

          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("package.json")

          if not p.exists():
              raise SystemExit(
                  "package.json missing after extraction"
              )

          package = json.loads(
              p.read_text(encoding="utf-8")
          )

          version = package.get("version")

          print("SidePlay version:", version)

          if version != "0.8.4-r9":
              raise SystemExit(
                  f"Expected 0.8.4-r9, got {version!r}"
              )

          ts = (
              package.get("devDependencies", {}).get("typescript")
              or package.get("dependencies", {}).get("typescript")
          )

          print("TypeScript:", ts)

          if ts and "5.8.0" in ts:
              raise SystemExit(
                  "Broken TypeScript 5.8.0 pin detected"
              )
          PY

          # Core app
          test -f src/App.tsx
          test -f scripts/patch-android.mjs

          # Native Android
          test -f native/android/PlaybackService.java
          test -f native/android/BackgroundAudioPlugin.java
          test -f native/android/NativeYouTubePlugin.java
          test -f native/android/YtDlpPlugin.java
          test -f native/android/YtDlpExtractorService.java
          test -f native/android/YtDlpIsolatedClient.java
          test -f native/android/NewPipeYouTubeResolver.java
          test -f native/android/SidePlayNewPipeDownloader.java

          # Intelligence
          test -f src/lib/trackIdentity.ts
          test -f src/lib/tasteEngine.ts
          test -f src/lib/musicIdentity.ts
          test -f src/lib/lyrics.ts
          test -f src/lib/universalSource.ts

          echo
          echo "Checking R9 intelligence..."

          grep -q 'repairTrackIdentity' \
            src/App.tsx

          grep -q 'buildTasteProfile' \
            src/lib/tasteEngine.ts

          grep -q 'rankAndDedupeMusicSearch' \
            src/lib/musicIdentity.ts

          grep -q 'NativeYouTube.lyrics' \
            src/lib/lyrics.ts

          grep -q 'recordSkip' \
            src/lib/store.tsx

          grep -q "queueOrigin: 'autoplay'" \
            src/App.tsx

          echo
          echo "Checking native search + lyrics..."

          grep -q 'public void suggest(PluginCall call)' \
            native/android/NativeYouTubePlugin.java

          grep -q 'public void lyrics(PluginCall call)' \
            native/android/NativeYouTubePlugin.java

          echo
          echo "Checking resolver fortress..."

          grep -q 'FFMPEG_INIT_LOCK' \
            native/android/YtDlpPlugin.java

          grep -q 'EXTRACTOR_LOCK' \
            native/android/YtDlpPlugin.java

          grep -q 'YtDlpIsolatedClient.resolve' \
            native/android/YtDlpPlugin.java

          grep -q 'requireIsolatedExtractorProcess' \
            native/android/YtDlpPlugin.java

          grep -q 'resolveBlocking' \
            native/android/YtDlpIsolatedClient.java

          grep -q 'newpipe-dash-adaptive' \
            native/android/NewPipeYouTubeResolver.java

          if grep -q 'javax.annotation' \
            native/android/SidePlayNewPipeDownloader.java
          then
            echo "❌ javax.annotation regression detected"
            exit 1
          fi

          echo
          echo "Checking Playback Resurrection..."

          grep -q 'START_STICKY' \
            native/android/PlaybackService.java

          grep -q 'hasRecentPlayingSnapshot' \
            native/android/PlaybackService.java

          grep -q 'recoverSnapshot' \
            native/android/PlaybackService.java

          grep -q 'process-resurrection' \
            native/android/PlaybackService.java

          grep -q 'restored-refreshed' \
            native/android/PlaybackService.java

          grep -q 'waiting-network' \
            native/android/PlaybackService.java

          grep -q 'RECOVERY_HEARTBEAT_MS' \
            native/android/PlaybackService.java

          echo
          echo "Checking diagnostics..."

          grep -q 'heartbeatAt' \
            native/android/BackgroundAudioPlugin.java

          grep -q 'LOW_MEMORY' \
            native/android/BackgroundAudioPlugin.java

          grep -q 'PACKAGE_UPDATED' \
            native/android/BackgroundAudioPlugin.java

          echo
          echo "Checking InnerTube circuit breaker..."

          grep -q 'innerTubeCooldownUntilMs' \
            native/android/NativeYouTubePlugin.java

          grep -q 'innerTubeFailureStreak' \
            native/android/NativeYouTubePlugin.java

          echo
          echo "✅ R9 Hotfix2 source verified"

      # ============================================================
      # 5. NODE 24
      # ============================================================

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      # ============================================================
      # 6. JAVA 21
      # ============================================================

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # ============================================================
      # 7. ANDROID SDK V4
      #
      # Important fix:
      # setup-android@v4 instead of v3.
      # ============================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      # ============================================================
      # 8. INSTALL EXACT ANDROID PACKAGES
      # ============================================================

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo

          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo
          echo "Installed SDK packages:"
          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --list_installed

      # ============================================================
      # 9. INSTALL NPM DEPENDENCIES
      # ============================================================

      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$SIDEPLAY_DIR"

          echo "Node:"
          node --version

          echo
          echo "npm:"
          npm --version

          echo
          echo "Package versions:"
          node - <<'NODE'
          const p = require("./package.json");

          console.log(
            "SidePlay:",
            p.version
          );

          console.log(
            "TypeScript:",
            p.devDependencies?.typescript ??
            p.dependencies?.typescript ??
            "not pinned"
          );
          NODE

          echo
          echo "Installing dependencies..."

          npm install \
            --no-audit \
            --no-fund

      # ============================================================
      # 10. CORE TESTS
      # ============================================================

      - name: Run SidePlay core tests
        shell: bash
        run: |
          set -euo pipefail

          cd "$SIDEPLAY_DIR"

          if npm run | grep -q 'test:core'; then
            npm run test:core
          else
            echo "⚠️ test:core script not present."
            echo "Continuing with build."
          fi

      # ============================================================
      # 11. BUILD WEB APP
      # ============================================================

      - name: Build SidePlay web app
        shell: bash
        run: |
          set -euo pipefail

          cd "$SIDEPLAY_DIR"

          npm run build

      # ============================================================
      # 12. GENERATE FRESH CAPACITOR ANDROID PROJECT
      # ============================================================

      - name: Generate fresh Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$SIDEPLAY_DIR"

          echo "Removing old generated Android directory..."
          rm -rf android

          echo
          echo "Creating fresh Capacitor Android project..."
          npx cap add android

          echo
          echo "Syncing Capacitor..."
          npx cap sync android

          echo
          echo "Applying SidePlay native patches..."
          node scripts/patch-android.mjs

          echo
          echo "✅ Android project generated and patched"

      # ============================================================
      # 13. VERIFY GENERATED NATIVE PROJECT
      # ============================================================

      - name: Verify generated native sources
        shell: bash
        run: |
          set -euo pipefail

          cd "$SIDEPLAY_DIR"

          JAVA="android/app/src/main/java/app/sideplay/mobile"
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          test -f "$JAVA/PlaybackService.java"
          test -f "$JAVA/BackgroundAudioPlugin.java"
          test -f "$JAVA/NativeYouTubePlugin.java"
          test -f "$JAVA/YtDlpPlugin.java"
          test -f "$JAVA/YtDlpExtractorService.java"
          test -f "$JAVA/YtDlpIsolatedClient.java"
          test -f "$JAVA/NewPipeYouTubeResolver.java"
          test -f "$JAVA/SidePlayNewPipeDownloader.java"

          echo
          echo "Checking Playback Resurrection survived patching..."

          grep -q 'START_STICKY' \
            "$JAVA/PlaybackService.java"

          grep -q 'hasRecentPlayingSnapshot' \
            "$JAVA/PlaybackService.java"

          grep -q 'recoverSnapshot' \
            "$JAVA/PlaybackService.java"

          grep -q 'process-resurrection' \
            "$JAVA/PlaybackService.java"

          grep -q 'RECOVERY_HEARTBEAT_MS' \
            "$JAVA/PlaybackService.java"

          echo
          echo "Checking diagnostics..."

          grep -q 'LOW_MEMORY' \
            "$JAVA/BackgroundAudioPlugin.java"

          grep -q 'PACKAGE_UPDATED' \
            "$JAVA/BackgroundAudioPlugin.java"

          echo
          echo "Checking InnerTube breaker..."

          grep -q 'innerTubeCooldownUntilMs' \
            "$JAVA/NativeYouTubePlugin.java"

          echo
          echo "Checking isolated processes..."

          grep -q \
            'android:process=":playback"' \
            "$MANIFEST"

          grep -q \
            'android:process=":extractor"' \
            "$MANIFEST"

          if grep -q 'javax.annotation' \
            "$JAVA/SidePlayNewPipeDownloader.java"
          then
            echo "❌ javax.annotation regression"
            exit 1
          fi

          echo
          echo "✅ Generated native project verified"

      # ============================================================
      # 14. FORCE VERSION + ARM64
      # ============================================================

      - name: Force SidePlay release identity
        shell: bash
        run: |
          set -euo pipefail

          cd "$SIDEPLAY_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")

          if not p.exists():
              raise SystemExit(
                  "android/app/build.gradle missing"
              )

          s = p.read_text(encoding="utf-8")

          s, version_code_matches = re.subn(
              r'(?m)^(\s*)versionCode\s+\d+\s*$',
              r'\1versionCode 816',
              s,
              count=1,
          )

          s, version_name_matches = re.subn(
              r'(?m)^(\s*)versionName\s+["\'][^"\']+["\']\s*$',
              r'\1versionName "0.8.4-r9"',
              s,
              count=1,
          )

          if version_code_matches != 1:
              raise SystemExit(
                  "Failed to patch versionCode. "
                  f"matches={version_code_matches}"
              )

          if version_name_matches != 1:
              raise SystemExit(
                  "Failed to patch versionName. "
                  f"matches={version_name_matches}"
              )

          arm64 = 'ndk { abiFilters "arm64-v8a" }'

          if arm64 not in s:
              marker = "defaultConfig {"

              if marker not in s:
                  raise SystemExit(
                      "defaultConfig block missing"
                  )

              s = s.replace(
                  marker,
                  marker + "\n        " + arm64,
                  1,
              )

          p.write_text(
              s,
              encoding="utf-8"
          )
          PY

          echo
          echo "Android release identity:"
          echo

          grep -n 'versionCode' \
            android/app/build.gradle

          grep -n 'versionName' \
            android/app/build.gradle

          grep -n 'abiFilters' \
            android/app/build.gradle

          grep -q 'versionCode 816' \
            android/app/build.gradle

          grep -q 'versionName "0.8.4-r9"' \
            android/app/build.gradle

          grep -q 'abiFilters "arm64-v8a"' \
            android/app/build.gradle

          echo
          echo "✅ versionCode=816"
          echo "✅ versionName=0.8.4-r9"
          echo "✅ ABI=arm64-v8a"

      # ============================================================
      # 15. BUILD RELEASE APK
      # ============================================================

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$SIDEPLAY_DIR/android"

          chmod +x gradlew

          ./gradlew \
            :app:clean \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

      # ============================================================
      # 16. LOCATE UNSIGNED APK
      #
      # Python only. No GNU find.
      # ============================================================

      - name: Locate unsigned release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$SIDEPLAY_DIR"

          APK="$(
            python3 - <<'PY'
          from pathlib import Path

          root = Path(
              "android/app/build/outputs/apk/release"
          )

          candidates = sorted(
              root.glob("*-release-unsigned.apk")
          )

          if not candidates:
              raise SystemExit(
                  "Unsigned release APK not found"
              )

          print(candidates[0].resolve())
          PY
          )"

          test -f "$APK"

          echo "UNSIGNED_APK=$APK" \
            >> "$GITHUB_ENV"

          echo
          echo "Unsigned APK:"
          echo "$APK"

      # ============================================================
      # 17. SIGN + VERIFY APK
      # ============================================================

      - name: Sign and verify APK
        shell: bash
        env:
          SIDEPLAY_KEYSTORE_B64: ${{ secrets.SIDEPLAY_KEYSTORE_B64 }}
          SIDEPLAY_KEYSTORE_PASSWORD: ${{ secrets.SIDEPLAY_KEYSTORE_PASSWORD }}
          SIDEPLAY_KEY_ALIAS: ${{ secrets.SIDEPLAY_KEY_ALIAS }}
          SIDEPLAY_KEY_PASSWORD: ${{ secrets.SIDEPLAY_KEY_PASSWORD }}

        run: |
          set -euo pipefail

          cd "$SIDEPLAY_DIR"

  
