name: Build SidePlay APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and verify Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare SidePlay source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf sideplay
          mkdir -p sideplay

          # Works both when the repository contains the expanded SidePlay source
          # and when the repository only contains a SidePlay-Node-v*.zip archive.
          if [ -f package.json ] && [ -f src/App.tsx ] && [ -f scripts/patch-android.mjs ]; then
            echo "Using expanded SidePlay source from repository root."
            rsync -a \
              --exclude '.git' \
              --exclude 'sideplay' \
              --exclude 'release' \
              --exclude 'signing' \
              --exclude 'node_modules' \
              --exclude 'dist' \
              --exclude 'android/.gradle' \
              --exclude 'android/app/build' \
              ./ sideplay/
          else
            ZIP_FILE="$(find . -maxdepth 1 -type f -name 'SidePlay-Node-v*.zip' -printf '%f\n' | sort -V | tail -n 1)"
            if [ -z "$ZIP_FILE" ] || [ ! -f "$ZIP_FILE" ]; then
              echo "ERROR: Put the expanded SidePlay source OR a SidePlay-Node-v*.zip in the repository root."
              exit 1
            fi
            echo "Using source archive: $ZIP_FILE"
            unzip -q "$ZIP_FILE" -d sideplay
          fi

          test -f sideplay/package.json
          test -f sideplay/src/App.tsx
          test -f sideplay/scripts/patch-android.mjs
          test -f sideplay/native/android/PlaybackService.java
          test -f sideplay/native/android/YtDlpPlugin.java
          test -f sideplay/native/android/MediaSafety.java
          echo "✅ SidePlay source verified"

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install dependencies
        working-directory: sideplay
        run: npm install --no-audit --no-fund

      - name: Build SidePlay web UI
        working-directory: sideplay
        run: npm run build

      - name: Create and sync Capacitor Android project
        working-directory: sideplay
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Apply SidePlay native patches
        working-directory: sideplay
        shell: bash
        run: |
          set -euo pipefail
          node scripts/patch-android.mjs
          test -f android/app/src/main/java/app/sideplay/mobile/MainActivity.java
          test -f android/app/src/main/java/app/sideplay/mobile/PlaybackService.java
          test -f android/app/src/main/java/app/sideplay/mobile/BackgroundAudioPlugin.java
          test -f android/app/src/main/java/app/sideplay/mobile/YtDlpPlugin.java
          grep -q 'youtubedl-android:library:0.18.1' android/app/build.gradle
          grep -q 'youtubedl-android:ffmpeg:0.18.1' android/app/build.gradle
          grep -q 'android:foregroundServiceType="mediaPlayback"' android/app/src/main/AndroidManifest.xml
          grep -q 'androidx.media3.session.MediaButtonReceiver' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_NETWORK_STATE' android/app/src/main/AndroidManifest.xml
          grep -q 'android:extractNativeLibs="true"' android/app/src/main/AndroidManifest.xml
          echo "✅ Native playback/background patch verified"

      - name: Build Android APK
        working-directory: sideplay/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:clean :app:assembleRelease --build-cache --stacktrace --no-daemon

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find sideplay/android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*-release-unsigned.apk' | head -n 1)"
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "ERROR: Gradle finished but no unsigned release APK was found."
            find sideplay/android/app/build/outputs/apk -maxdepth 3 -type f -print || true
            exit 1
          fi
          mkdir -p signing release
          cp "$APK" signing/SidePlay-unsigned.apk

      - name: Prepare signing key
        id: signing
        shell: bash
        env:
          SIDEPLAY_KEYSTORE_B64: ${{ secrets.SIDEPLAY_KEYSTORE_B64 }}
          SIDEPLAY_KEYSTORE_PASSWORD: ${{ secrets.SIDEPLAY_KEYSTORE_PASSWORD }}
          SIDEPLAY_KEY_ALIAS: ${{ secrets.SIDEPLAY_KEY_ALIAS }}
          SIDEPLAY_KEY_PASSWORD: ${{ secrets.SIDEPLAY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${SIDEPLAY_KEYSTORE_B64:-}" ] && [ -n "${SIDEPLAY_KEYSTORE_PASSWORD:-}" ] && [ -n "${SIDEPLAY_KEY_ALIAS:-}" ] && [ -n "${SIDEPLAY_KEY_PASSWORD:-}" ]; then
            echo "$SIDEPLAY_KEYSTORE_B64" | base64 --decode > signing/sideplay.jks
            echo "stable=true" >> "$GITHUB_OUTPUT"
            {
              echo "SIDEPLAY_SIGN_KS_PASS=$SIDEPLAY_KEYSTORE_PASSWORD"
              echo "SIDEPLAY_SIGN_KEY_ALIAS=$SIDEPLAY_KEY_ALIAS"
              echo "SIDEPLAY_SIGN_KEY_PASS=$SIDEPLAY_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "✅ Using persistent GitHub signing key"
          else
            keytool -genkeypair -v \
              -keystore signing/sideplay.jks \
              -storepass sideplay123 \
              -keypass sideplay123 \
              -alias sideplay \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=SidePlay CI Test, OU=Testing, O=SidePlay, C=DO"
            echo "stable=false" >> "$GITHUB_OUTPUT"
            {
              echo "SIDEPLAY_SIGN_KS_PASS=sideplay123"
              echo "SIDEPLAY_SIGN_KEY_ALIAS=sideplay"
              echo "SIDEPLAY_SIGN_KEY_PASS=sideplay123"
            } >> "$GITHUB_ENV"
            echo "⚠️ No GitHub signing secrets configured. This APK is installable, but future CI builds will not update it in-place."
          fi

      - name: Zipalign APK
        shell: bash
        run: |
          set -euo pipefail
          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign"
          "$ZIPALIGN" -f -p 4 signing/SidePlay-unsigned.apk signing/SidePlay-aligned.apk
          "$ZIPALIGN" -c -v 4 signing/SidePlay-aligned.apk

      - name: Sign APK
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          "$APKSIGNER" sign \
            --ks signing/sideplay.jks \
            --ks-key-alias "$SIDEPLAY_SIGN_KEY_ALIAS" \
            --ks-pass "pass:$SIDEPLAY_SIGN_KS_PASS" \
            --key-pass "pass:$SIDEPLAY_SIGN_KEY_PASS" \
            --out release/SidePlay-v0.8.0.apk \
            signing/SidePlay-aligned.apk

      - name: Verify final APK
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign"
          AAPT2="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2"
          APK="release/SidePlay-v0.8.0.apk"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$ZIPALIGN" -c -v 4 "$APK"
          "$AAPT2" dump badging "$APK" | tee release/APK_BADGING.txt
          grep -q "package: name='app.sideplay.mobile'" release/APK_BADGING.txt
          sha256sum "$APK" > release/SHA256.txt
          echo "✅ Final APK is signed, aligned and parseable"

      - name: Prepare release notes
        shell: bash
        run: |
          cat > release/README.txt <<'TXT'
          SidePlay v0.8.0 — music-first hi-fi product polish

          Install: SidePlay-v0.8.0.apk
          Package: app.sideplay.mobile

          Background playback:
          - Media3 MediaSessionService owns native playback outside the Activity/WebView
          - foreground media notification + lock-screen/Bluetooth controls
          - wake/network mode for active streaming
          - survives task swipe while a native item exists
          - reconnects after network restoration
          - stable/local native items support Media3 playback resumption after service death
          - session-cookie/browser captures remain intentionally ephemeral and are re-resolved in SidePlay instead of persisting credentials

          Engine:
          - yt-dlp first-line provider extraction
          - generic resolver + Media Catcher fallbacks
          - HLS/DASH/RTSP/direct/local playback
          - yt-dlp + FFmpeg adaptive offline assembly for clear sources
          - malicious-download safety gate before vault admission
          TXT

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SidePlay-v0.8.0-VERIFIED-APK
          path: |
            release/SidePlay-v0.8.0.apk
            release/SHA256.txt
            release/APK_BADGING.txt
            release/README.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for version tag
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.stable == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              release/SidePlay-v0.8.0.apk \
              release/SHA256.txt \
              release/README.txt \
              --clobber
          else
            gh release create "$TAG" \
              release/SidePlay-v0.8.0.apk \
              release/SHA256.txt \
              release/README.txt \
              --title "SidePlay $TAG" \
              --generate-notes
          fi
          echo "✅ GitHub Release published: $TAG"

      - name: Explain skipped tag release without stable signing
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.stable != 'true'
        shell: bash
        run: |
          echo "::warning::Tag build succeeded, but GitHub Release publication was skipped because persistent signing secrets are not configured. See GITHUB_DEPLOY.md."
          
