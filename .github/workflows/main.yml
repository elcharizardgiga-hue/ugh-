name: Build SidePlay APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    name: Build Signed Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v7

      # ============================================================
      # 2. EXTRACT SIDEPLAY SOURCE
      # ============================================================

      - name: Extract SidePlay v0.3.5 source
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Repository files"
          echo "======================================"
          ls -la

          ZIP_FILE="SidePlay-Node-v0.3.5-aggressive-verified-spotify-handoff.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo ""
            echo "ERROR: $ZIP_FILE is missing from repository root."
            exit 1
          fi

          echo ""
          echo "Found SidePlay source:"
          echo "$ZIP_FILE"

          rm -rf sideplay
          mkdir -p sideplay

          unzip -q "$ZIP_FILE" -d sideplay

          echo ""
          echo "======================================"
          echo "Extracted SidePlay"
          echo "======================================"
          ls -la sideplay

          if [ ! -f sideplay/package.json ]; then
            echo "ERROR: package.json was not extracted."
            exit 1
          fi

          if [ ! -f sideplay/src/App.tsx ]; then
            echo "ERROR: src/App.tsx was not extracted."
            exit 1
          fi

          if [ ! -f sideplay/scripts/patch-android.mjs ]; then
            echo "ERROR: scripts/patch-android.mjs was not extracted."
            exit 1
          fi

          echo ""
          echo "✅ SidePlay source verified"

      # ============================================================
      # 3. NODE
      # ============================================================

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      # ============================================================
      # 4. JAVA
      # ============================================================

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # ============================================================
      # 5. ANDROID SDK
      # ============================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Verify build environment
        shell: bash
        run: |
          set -e

          echo "Node:"
          node --version

          echo ""
          echo "NPM:"
          npm --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Android SDK:"
          echo "$ANDROID_SDK_ROOT"

          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign"
          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"

          echo ""
          echo "✅ Android build tools available"

      # ============================================================
      # 6. INSTALL JS DEPENDENCIES
      # ============================================================

      - name: Install JavaScript dependencies
        working-directory: sideplay
        shell: bash
        run: |
          set -e

          npm install --no-audit --no-fund

      # ============================================================
      # 7. BUILD REACT/VITE APP
      # ============================================================

      - name: Build SidePlay web UI
        working-directory: sideplay
        shell: bash
        run: |
          set -e

          npm run build

          echo ""
          echo "Checking Vite output..."

          test -d dist || {
            echo "ERROR: dist directory was not generated."
            exit 1
          }

          echo "✅ Web UI built"

      # ============================================================
      # 8. CREATE / SYNC CAPACITOR ANDROID PROJECT
      # ============================================================

      - name: Create and sync Capacitor Android project
        working-directory: sideplay
        shell: bash
        run: |
          set -e

          if [ ! -d android ]; then
            echo "Creating Capacitor Android project..."
            npx cap add android
          fi

          echo "Syncing Capacitor..."
          npx cap sync android

          test -d android/app || {
            echo "ERROR: Capacitor Android project is missing."
            exit 1
          }

          echo "✅ Capacitor Android project ready"

      # ============================================================
      # 9. APPLY SIDEPLAY NATIVE PATCHES
      # ============================================================

      - name: Apply SidePlay native Android patches
        working-directory: sideplay
        shell: bash
        run: |
          set -e

          node scripts/patch-android.mjs

          echo ""
          echo "======================================"
          echo "Checking SidePlay native classes"
          echo "======================================"

          test -f android/app/src/main/java/app/sideplay/mobile/PlaybackService.java
          test -f android/app/src/main/java/app/sideplay/mobile/BackgroundAudioPlugin.java
          test -f android/app/src/main/java/app/sideplay/mobile/OfflineMediaPlugin.java
          test -f android/app/src/main/java/app/sideplay/mobile/SpotifySessionPlugin.java
          test -f android/app/src/main/java/app/sideplay/mobile/SpotifySessionListenerService.java
          test -f android/app/src/main/java/app/sideplay/mobile/MainActivity.java

          echo "✅ Native SidePlay classes present"

      # ============================================================
      # 10. CHECK MANIFEST
      # ============================================================

      - name: Inspect generated Android manifest
        working-directory: sideplay
        shell: bash
        run: |
          set -e

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          test -f "$MANIFEST"

          echo "======================================"
          echo "Spotify listener"
          echo "======================================"
          grep -n "SpotifySessionListenerService" "$MANIFEST" || true

          echo ""
          echo "======================================"
          echo "Playback service"
          echo "======================================"
          grep -n "PlaybackService" "$MANIFEST" || true

          echo ""
          echo "======================================"
          echo "PiP check"
          echo "======================================"

          if grep -qi "supportsPictureInPicture.*true" "$MANIFEST"; then
            echo "ERROR: PiP is unexpectedly enabled."
            exit 1
          else
            echo "✅ PiP is not enabled"
          fi

      # ============================================================
      # 11. BUILD APK WITH GRADLE
      # ============================================================

      - name: Build SidePlay Android APK
        working-directory: sideplay/android
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew :app:assembleDebug \
            --build-cache \
            --stacktrace \
            --no-daemon

          echo ""
          echo "✅ Gradle build completed"

      # ============================================================
      # 12. LOCATE APK
      # ============================================================

      - name: Prepare unsigned APK
        shell: bash
        run: |
          set -e

          APK="sideplay/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Gradle completed but app-debug.apk was not found."
            echo ""
            echo "Available APK files:"
            find sideplay/android -type f -name "*.apk" -print || true
            exit 1
          fi

          mkdir -p signing
          mkdir -p release

          cp "$APK" signing/SidePlay-unsigned.apk

          echo "Unsigned APK:"
          ls -lh signing/SidePlay-unsigned.apk

      # ============================================================
      # 13. GENERATE SIGNING KEY
      # ============================================================

      - name: Generate SidePlay signing key
        shell: bash
        run: |
          set -e

          keytool \
            -genkeypair \
            -v \
            -keystore signing/sideplay-test.jks \
            -storepass sideplay123 \
            -keypass sideplay123 \
            -alias sideplay \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=SidePlay, OU=Testing, O=SidePlay, C=DO"

          test -f signing/sideplay-test.jks

          echo ""
          echo "✅ Signing key generated"

      # ============================================================
      # 14. ZIPALIGN
      # ============================================================

      - name: Zipalign SidePlay APK
        shell: bash
        run: |
          set -e

          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign"

          "$ZIPALIGN" \
            -f \
            -p \
            4 \
            signing/SidePlay-unsigned.apk \
            signing/SidePlay-aligned.apk

          "$ZIPALIGN" \
            -c \
            -v \
            4 \
            signing/SidePlay-aligned.apk

          echo ""
          echo "✅ APK zipalignment verified"

      # ============================================================
      # 15. SIGN APK
      # ============================================================

      - name: Sign SidePlay APK
        shell: bash
        run: |
          set -e

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"

          "$APKSIGNER" sign \
            --ks signing/sideplay-test.jks \
            --ks-key-alias sideplay \
            --ks-pass pass:sideplay123 \
            --key-pass pass:sideplay123 \
            --out release/SidePlay-v0.3.5.apk \
            signing/SidePlay-aligned.apk

          test -f release/SidePlay-v0.3.5.apk

          echo ""
          echo "✅ APK signed"

      # ============================================================
      # 16. VERIFY SIGNATURE
      # ============================================================

      - name: Verify SidePlay APK signature
        shell: bash
        run: |
          set -e

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"

          echo "======================================"
          echo "VERIFYING SIDEPLAY APK SIGNATURE"
          echo "======================================"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            release/SidePlay-v0.3.5.apk

          echo ""
          echo "======================================"
          echo "✅ SIDEPLAY APK SIGNATURE VERIFIED"
          echo "======================================"

      # ============================================================
      # 17. FINAL ZIPALIGN CHECK
      # ============================================================

      - name: Verify final APK alignment
        shell: bash
        run: |
          set -e

          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" \
            -c \
            -v \
            4 \
            release/SidePlay-v0.3.5.apk

          echo ""
          echo "✅ Final APK alignment verified"

      # ============================================================
      # 18. APK PACKAGE INFORMATION
      # ============================================================

      - name: Inspect final APK
        shell: bash
        run: |
          set -e

          AAPT="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"

          echo "======================================"
          echo "FINAL APK"
          echo "======================================"

          ls -lh release/SidePlay-v0.3.5.apk

          echo ""
          echo "======================================"
          echo "PACKAGE INFORMATION"
          echo "======================================"

          "$AAPT" dump badging release/SidePlay-v0.3.5.apk | head -n 25

      # ============================================================
      # 19. HASH + README
      # ============================================================

      - name: Prepare release files
        shell: bash
        run: |
          set -e

          sha256sum \
            release/SidePlay-v0.3.5.apk \
            > release/SHA256.txt

          cat > release/README.txt <<'EOF'
          SidePlay v0.3.5
          Aggressive Verified Spotify Handoff
          No PiP

          Android package:
          app.sideplay.mobile

          INSTALL:

          Install:
          SidePlay-v0.3.5.apk

          SPOTIFY SETUP:

          1. Spotify must be installed and logged in.
          2. Open Spotify and play a song once.
          3. Open SidePlay.
          4. Open Settings.
          5. Grant SidePlay Notification Access.
          6. Return to SidePlay.
          7. Refresh Spotify engine status.
          8. Enable "Prefer Spotify for online tracks".

          v0.3.5 HANDOFF:

          SidePlay attempts multiple Spotify handoff strategies.
          Spotify playback is only considered successful after
          SidePlay verifies the requested track using Spotify's
          active media-session metadata.

          PiP is disabled.

          The final APK was:
          - built with Gradle
          - zipaligned
          - explicitly signed
          - signature verified
          - alignment verified
          EOF

          echo ""
          echo "======================================"
          echo "RELEASE CONTENTS"
          echo "======================================"

          ls -lh release/

          echo ""
          cat release/SHA256.txt

      # ============================================================
      # 20. UPLOAD APK
      # ============================================================

      - name: Upload signed SidePlay APK
        uses: actions/upload-artifact@v4
        with:
          name: SidePlay-v0.3.5-SIGNED-APK
          path: |
            release/SidePlay-v0.3.5.apk
            release/SHA256.txt
            release/README.txt
          if-no-files-found: error
          retention-days: 14
